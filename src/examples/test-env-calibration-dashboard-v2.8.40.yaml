# Switch Vision test environment calibration dashboard
# Default version: no layout-card dependency
#
# Use this example for the fresh HAOS / Discovery-generated test stack.
# It expects Switch Vision Discovery to generate SNMP2MQTT entities with
# prefixes SW5 and SW6 from /share/switch_vision/generated-snmp2mqtt.yaml.

views:
  - title: Switch Vision Calibration Test Env
    path: switch-vision-calibration-test-env
    cards:
      - type: markdown
        content: |
          ## Switch Vision Calibration — Test Environment

          This dashboard is for the SW5/SW6 test stack generated by Switch Vision Discovery.

          1. Confirm Switch Vision SNMP2MQTT is importing `/share/switch_vision/generated-snmp2mqtt.yaml`.
          2. Confirm Home Assistant has entities such as `sensor.sw5_port_1_status` and `sensor.sw6_port_1_status`.
          3. Open a card and click **Calibrate**.
          4. Move ports, LEDs, logo, status panel, or status rows.
          5. Click **Save Profile** for SW5 and SW6.
          6. Return to the live dashboard and keep `calibration_button: true`.

      - type: custom:switch-vision-3650
        title: Calibration — SW5 Test Stack Member 1
        member: SW5
        demo: false
        calibration_profile: SW5
        calibration_button: true
        switch_ip: 192.168.1.102
        calibration_mode: true
        calibration_controls: true
        status_entity_prefix: sensor.sw5_port_
        status_entity_suffix: _status

      - type: custom:switch-vision-3650
        title: Calibration — SW6 Test Stack Member 2
        member: SW6
        demo: false
        calibration_profile: SW6
        calibration_button: true
        switch_ip: 192.168.1.102
        calibration_mode: true
        calibration_controls: true
        stack_enabled: true
        stack_uptime_mode: inherit_stack
        stack_uptime_source: sensor.sw5_uptime
        status_entity_prefix: sensor.sw6_port_
        status_entity_suffix: _status
