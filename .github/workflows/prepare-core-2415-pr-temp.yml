name: TEMP Prepare Core 2.4.15 UniFi status telemetry

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  prepare:
    if: github.head_ref == 'review/unifi-native-status-panel-2.4.15'
    runs-on: ubuntu-latest
    steps:
      - name: Check out review branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install build dependency
        run: python3 -m pip install --disable-pip-version-check PyYAML

      - name: Prepare and validate Core 2.4.15
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f tools/prepare_core_2415_temp.py ]; then
            echo 'Review branch is already prepared.'
            exit 0
          fi
          if [ -f tools/fix_prepare_core_2415_temp.py ]; then
            python3 tools/fix_prepare_core_2415_temp.py
          fi
          python3 tools/prepare_core_2415_temp.py

      - name: Commit finished review build
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/prepare_core_2415_temp.py tools/fix_prepare_core_2415_temp.py
          find src tests -type d -name '__pycache__' -prune -exec rm -rf {} +
          find src tests -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          git add -A
          if git diff --cached --quiet; then
            echo 'No preparation changes to commit.'
            exit 0
          fi
          git diff --cached --check
          git config user.name 'switch-vision-release-bot'
          git config user.email 'switch-vision@users.noreply.github.com'
          git commit -m 'Core 2.4.15: UniFi-native status telemetry'
          git push origin HEAD:${{ github.head_ref }}
