name: Prepare Core 2.7.9 native UniFi activity

on:
  push:
    branches:
      - fix/core-2.7.9-faceplate-matrix
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/core-2.7.9-faceplate-matrix
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependency
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Apply native UniFi activity patch
        run: python tools/patch_core_279_unifi_activity.py

      - name: Validate focused activity regression
        run: python tests/test_unifi_native_activity_counters.py

      - name: Validate frontend syntax
        run: node --check src/custom_components/switch_vision/switch-vision-card.js

      - name: Rebuild Core 2.7.9 deterministically
        shell: bash
        run: |
          set -euo pipefail
          python build.py -v 2.7.9
          rm -f \
            Releases/switch-vision-2.7.9.zip \
            Switch_Vision_v2.7.9_source.zip \
            Switch_Vision_v2.7.9_SHA256SUMS.txt
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete

      - name: Validate rebuilt parity and focused regression
        shell: bash
        run: |
          set -euo pipefail
          python tools/check_core_release_parity.py
          python tests/test_unifi_native_activity_counters.py
          node --check src/custom_components/switch_vision/switch-vision-card.js
          node --check Releases/switch-vision-2.7.9/custom_components/switch_vision/switch-vision-card.js

      - name: Commit rebuilt Core 2.7.9 tree
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "Switch Vision SV-Dev"
          git config user.email "switch-vision@users.noreply.github.com"
          git add -A
          git commit -m "Core 2.7.9: consume native UniFi activity counters"
          git push origin HEAD:fix/core-2.7.9-faceplate-matrix
