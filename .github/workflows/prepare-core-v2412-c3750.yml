name: Prepare Core v2.4.12 Catalyst 3750 review

on:
  push:
    branches:
      - review/sv-2026-000020-c3750

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Check out review branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install build dependency
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Add Catalyst 3750 exact-model contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          import yaml

          registry_path = Path('src/devices/supported_devices.yaml')
          registry = yaml.safe_load(registry_path.read_text(encoding='utf-8')) or {}
          devices = registry.get('devices') or []
          if any(isinstance(d, dict) and d.get('model') == 'WS-C3750-48P' for d in devices):
              raise SystemExit('WS-C3750-48P already exists')

          device = {
              'vendor': 'Cisco',
              'family': 'Catalyst 3750',
              'model': 'WS-C3750-48P',
              'status': 'experimental',
              'confirmed_since': '2.4.12',
              'last_validated_version': '2.4.12',
              'evidence': 'sanitized_community_real_hardware_capture',
              'ports': {
                  'rj45': 48,
                  'poe': True,
                  'uplinks': 4,
                  'uplink_type': '4x 1G SFP',
                  'gigabit_sfp': 4,
                  'ten_gigabit_sfp_plus': 0,
              },
              'stack_support': True,
              'discovery_support': True,
              'dashboard_support': True,
              'mapping_profile': 'cisco-3750-48p-48fe-4sfp',
              'calibration_profile': 'default_cisco_48_port',
              'default_faceplate': 'faceplates/48rj45-4sfp.png',
              'optional_faceplates': [],
              'tested_firmware': [],
              'contributor': {
                  'display_name': 'Community contributor',
                  'public_credit': False,
              },
              'notes': [
                  'A sanitized real-hardware contribution reports the exact SNMP model string WS-C3750-48P.',
                  'The non-G Catalyst 3750 48-port PoE platform uses 48 10/100 FastEthernet access ports and four 1G SFP uplinks; access ports must not be advertised as Gigabit-capable.',
                  'The reported SNMP platform string does not include the retail software-feature suffix, so Switch Vision does not infer an IP Base/IP Services SKU suffix.',
                  'The 48 RJ45 plus four SFP socket geometry matches the existing neutral 48+4 faceplate; live overlay alignment remains Experimental pending contributor confirmation.',
                  'Catalyst 3750 StackWise numbering is supported by the mapping profile, but multi-member stack behaviour remains pending live validation.',
              ],
              'validation': {
                  'exact_model_detection': 'contribution_confirmed',
                  'rj45_mapping': 'candidate_48_fastethernet_ports_pending_live_dashboard_validation',
                  'poe': 'candidate_platform_contract_pending_live_dashboard_validation',
                  'system_sensors': 'pending',
                  'uplinks': 'candidate_four_1g_sfp_pending_live_validation',
                  'stack': 'capable_pending_live_validation',
              },
              'visuals': {
                  'status': 'experimental',
                  'recommended_faceplate': 'faceplates/48rj45-4sfp.png',
                  'optional_faceplates': [],
                  'calibration_profile': 'default_cisco_48_port',
                  'canvas': {'width': 2048, 'height': 448},
              },
          }
          devices.append(device)
          registry['devices'] = devices
          registry_path.write_text(
              yaml.safe_dump(registry, sort_keys=False, allow_unicode=True),
              encoding='utf-8',
              newline='\n',
          )

          test_path = Path('tests/test_c3750_48p_contract.py')
          test_path.write_text(textwrap.dedent(r'''
              from __future__ import annotations

              import json
              import unittest
              from pathlib import Path

              ROOT = Path(__file__).resolve().parents[1]
              REGISTRY = ROOT / "src" / "devices" / "supported_devices.json"


              class Catalyst3750ContractTests(unittest.TestCase):
                  def setUp(self) -> None:
                      payload = json.loads(REGISTRY.read_text(encoding="utf-8"))
                      self.device = next(
                          d for d in payload["devices"]
                          if isinstance(d, dict) and d.get("model") == "WS-C3750-48P"
                      )

                  def test_exact_model_and_physical_contract(self) -> None:
                      device = self.device
                      ports = device["ports"]
                      self.assertEqual(device["status"], "experimental")
                      self.assertEqual(device["mapping_profile"], "cisco-3750-48p-48fe-4sfp")
                      self.assertEqual(ports["rj45"], 48)
                      self.assertIs(ports["poe"], True)
                      self.assertEqual(ports["uplinks"], 4)
                      self.assertEqual(ports["gigabit_sfp"], 4)
                      self.assertEqual(ports["ten_gigabit_sfp_plus"], 0)
                      self.assertIs(device["stack_support"], True)

                  def test_fastethernet_semantics_are_preserved(self) -> None:
                      notes = "\n".join(str(n) for n in self.device.get("notes") or [])
                      self.assertIn("10/100 FastEthernet", notes)
                      self.assertIn("must not be advertised as Gigabit-capable", notes)
                      self.assertIn("does not include the retail software-feature suffix", notes)

                  def test_visual_and_privacy_contract(self) -> None:
                      self.assertEqual(self.device["default_faceplate"], "faceplates/48rj45-4sfp.png")
                      self.assertEqual(self.device["calibration_profile"], "default_cisco_48_port")
                      self.assertEqual(
                          self.device["contributor"],
                          {"display_name": "Community contributor", "public_credit": False},
                      )
                      serialized = json.dumps(self.device)
                      self.assertNotIn("SV-2026-", serialized)
                      self.assertNotIn("Carlos", serialized)


              if __name__ == "__main__":
                  unittest.main()
          ''').lstrip(), encoding='utf-8', newline='\n')

          changelog = Path('CHANGELOG.md')
          entry = textwrap.dedent('''
              ## v2.4.12 — Catalyst 3750 48-port hardware contract

              - Add Experimental exact-model handling for the community-observed `WS-C3750-48P` platform string.
              - Preserve the non-G Catalyst 3750 physical contract as 48 × 10/100 FastEthernet PoE access ports plus 4 × 1G SFP uplinks; do not mislabel the copper ports as Gigabit-capable.
              - Reuse the truthful 48-RJ45 + 4-SFP socket geometry while keeping live overlay/uplink/stack validation pending.
              - Keep the public registry anonymous and omit private submission identifiers and filenames.
              - Add permanent regression coverage for model identity, port counts, FastEthernet semantics, visual defaults, and attribution privacy.

          ''')
          changelog.write_text(entry + changelog.read_text(encoding='utf-8'), encoding='utf-8', newline='\n')

          Path('RELEASE_NOTES.md').write_text(textwrap.dedent('''
              # Switch Vision Core v2.4.12

              Core 2.4.12 adds Experimental exact-model support for the community-observed Cisco `WS-C3750-48P` platform string.

              The hardware contract deliberately preserves this non-G Catalyst 3750 generation as 48 × 10/100 FastEthernet PoE access ports plus four 1G SFP uplinks. The existing neutral 48+4 visual geometry is used because the socket count matches, while live overlay alignment, uplinks, PoE presentation and multi-member StackWise behaviour remain pending contributor validation.

              Public contribution metadata remains anonymous and contains no private submission identifiers or filenames.
          ''').lstrip(), encoding='utf-8', newline='\n')
          PY

      - name: Build and validate Core 2.4.12
        shell: bash
        run: |
          set -euo pipefail
          python build.py -v 2.4.12
          python tests/test_c3750_48p_contract.py
          python tests/test_device_registry_contracts.py
          python tests/test_public_attribution_privacy.py
          python tests/test_release_metadata_contract.py
          node --check src/js/switch-vision.js
          node --check src/custom_components/switch_vision/switch-vision-card.js
          git diff --check
          test "$(cat VERSION)" = "2.4.12"
          test -d Releases/switch-vision-2.4.12

      - name: Commit tested Core 2.4.12 review source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'switch-vision-release-bot'
          git config user.email 'switch-vision@users.noreply.github.com'
          git add -A
          git commit -m 'Prepare Switch Vision Core v2.4.12 Catalyst 3750 contract'
          git push origin HEAD:review/sv-2026-000020-c3750
