name: TEMP Prepare Jan Core 2.4.13

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/sv-jan-core-2.4.13-prep-temp.yml

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare Core 2.4.13 review branch
    runs-on: ubuntu-latest

    steps:
      - name: Checkout review branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: review/inbox-audit-core-2.4.13
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install build dependency
        run: python3 -m pip install --disable-pip-version-check PyYAML

      - name: Reset review branch to current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B review/inbox-audit-core-2.4.13 origin/main

      - name: Apply Jan UI fixes and regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          version = "2.4.13"

          card = Path("src/js/switch-vision.js")
          text = card.read_text(encoding="utf-8")
          pattern = re.compile(
              r"(const addHitbox = \(type, id, item\) => \{\n)"
              r"(?P<i>\s*)if \(!item\?\.center \|\| !item\?\.hitbox\) return;\n"
              r"(?P=i)const \[cx, cy\] = item\.center;\n"
              r"(?P=i)const \[w, h\] = visualHitboxSize\(type, item\.hitbox\);"
          )

          def replace_hitbox(match):
              i = match.group("i")
              return (
                  match.group(1)
                  + f"{i}if (!item?.center) return;\n"
                  + f"{i}const fallbackHitbox = type === \"port\" ? [34, 56] : [94, 48];\n"
                  + f"{i}const [cx, cy] = item.center;\n"
                  + f"{i}const [w, h] = visualHitboxSize(type, item.hitbox || fallbackHitbox);"
              )

          text, count = pattern.subn(replace_hitbox, text, count=1)
          if count != 1:
              raise SystemExit(f"Expected exactly one addHitbox gate to patch, found {count}")
          card.write_text(text, encoding="utf-8")

          panel = Path("src/custom_components/switch_vision/switch-vision-panel.js")
          panel_text = panel.read_text(encoding="utf-8")
          old_meta = ".meta{font-family:monospace;white-space:pre-wrap;word-break:break-word;background:#0d1216;padding:12px;border-radius:8px;max-height:320px;overflow:auto}"
          new_meta = ".meta{font-family:monospace;white-space:pre-wrap;word-break:break-word;background:#0d1216;color:#e8eef3;padding:12px;border-radius:8px;max-height:320px;overflow:auto}"
          if panel_text.count(old_meta) != 1:
              raise SystemExit(f"Expected exactly one native diagnostics .meta rule, found {panel_text.count(old_meta)}")
          panel.write_text(panel_text.replace(old_meta, new_meta, 1), encoding="utf-8")

          Path("VERSION").write_text(version + "\n", encoding="utf-8")

          notes = f"""# Switch Vision Core v{version}

Core {version} fixes two UI regressions reported against the Zyxel XS1930-10 dashboard.

Rendered ports now remain selectable even when a saved or custom calibration supplies a port centre but omits an explicit hitbox. Switch Vision derives a safe default hitbox for that rendered socket instead of letting the click fall through to the switch-summary background handler. This preserves normal blank-description behaviour such as `DESC —` while keeping the selected port active.

The native dashboard Advanced diagnostics block now sets an explicit light foreground on its fixed dark background so diagnostics remain readable under Home Assistant themes that provide a dark/black primary text colour.

No device mapping, SNMP/UniFi telemetry, faceplate geometry, or Discovery behaviour changes are included in this corrective release.
"""
          for path in (Path("RELEASE_NOTES.md"), Path("src/RELEASE_NOTES.md")):
              path.write_text(notes, encoding="utf-8")

          entry = """
## v2.4.13 — Port selection and native diagnostics theme fixes

- Keep rendered ports clickable when a saved/custom calibration has a port `center` but no explicit `hitbox`; derive the standard visual hitbox instead of allowing the click to fall through to switch summary.
- Preserve blank port descriptions as a selected-port state (`DESC —`) rather than confusing missing description data with selection failure.
- Give the native dashboard Advanced diagnostics block an explicit light foreground on its fixed dark background so it remains readable under UniFi/dark Home Assistant themes.
- Add permanent regression coverage for calibration hitbox fallback and native diagnostics contrast.
- No device mapping, telemetry, faceplate geometry, or Discovery behaviour changes.
"""
          root_changelog = Path("CHANGELOG.md")
          existing = root_changelog.read_text(encoding="utf-8")
          if "## v2.4.13 — Port selection and native diagnostics theme fixes" not in existing:
              existing = entry + existing
          for path in (Path("CHANGELOG.md"), Path("src/CHANGELOG.md")):
              path.write_text(existing, encoding="utf-8")

          test = r'''from pathlib import Path

ROOT = Path(__file__).resolve().parents[1]
CARD_SOURCE = ROOT / "src" / "js" / "switch-vision.js"
CARD_PACKAGED = ROOT / "src" / "custom_components" / "switch_vision" / "switch-vision-card.js"
PANEL = ROOT / "src" / "custom_components" / "switch_vision" / "switch-vision-panel.js"


def check_card(path: Path) -> None:
    text = path.read_text(encoding="utf-8")
    assert "if (!item?.center) return;" in text, path
    assert 'const fallbackHitbox = type === "port" ? [34, 56] : [94, 48];' in text, path
    assert "visualHitboxSize(type, item.hitbox || fallbackHitbox)" in text, path
    assert "if (!item?.center || !item?.hitbox) return;" not in text, path


def main() -> None:
    check_card(CARD_SOURCE)
    check_card(CARD_PACKAGED)

    panel = PANEL.read_text(encoding="utf-8")
    expected = ".meta{font-family:monospace;white-space:pre-wrap;word-break:break-word;background:#0d1216;color:#e8eef3;padding:12px;border-radius:8px;max-height:320px;overflow:auto}"
    assert expected in panel
    assert "background:#0d1216;padding:12px" not in panel

    print("Jan UI regressions: PASS")


if __name__ == "__main__":
    main()
'''
          Path("tests/test_jan_ui_regressions.py").write_text(test, encoding="utf-8")
          PY

      - name: Build Core 2.4.13
        shell: bash
        run: |
          set -euo pipefail
          python3 build.py -v 2.4.13
          rm -f \
            Releases/switch-vision-2.4.13.zip \
            Releases/switch-vision-2.4.13.zip.sha256 \
            Switch_Vision_v2.4.13_source.zip \
            Switch_Vision_v2.4.13_SHA256SUMS.txt

      - name: Validate JavaScript syntax
        run: |
          node --check src/js/switch-vision.js
          node --check src/custom_components/switch_vision/switch-vision-card.js
          node --check src/custom_components/switch_vision/switch-vision-panel.js
          node --check src/custom_components/switch_vision/switch-vision-dashboard-strategy.js

      - name: Validate parity, metadata, and permanent regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check_core_release_parity.py
          python3 -m py_compile \
            src/custom_components/switch_vision/__init__.py \
            src/custom_components/switch_vision/config_flow.py \
            src/devices/generate_supported_devices.py \
            tests/*.py
          for test in tests/test_*.py; do
            echo "::group::$test"
            python3 "$test"
            echo "::endgroup::"
          done
          find src tests -type d -name '__pycache__' -prune -exec rm -rf {} +
          find src tests -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete

      - name: Verify deterministic rebuild
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          python3 build.py -v 2.4.13
          rm -f \
            Releases/switch-vision-2.4.13.zip \
            Releases/switch-vision-2.4.13.zip.sha256 \
            Switch_Vision_v2.4.13_source.zip \
            Switch_Vision_v2.4.13_SHA256SUMS.txt
          find src tests -type d -name '__pycache__' -prune -exec rm -rf {} +
          find src tests -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          git diff --exit-code
          if [ -n "$(git status --porcelain --untracked-files=all | grep '^??' || true)" ]; then
            echo "ERROR: deterministic rebuild left unexpected untracked files"
            git status --short --untracked-files=all
            exit 1
          fi

      - name: Commit and push review branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Core 2.4.13: fix port selection and diagnostics theme"
          git push origin HEAD:review/inbox-audit-core-2.4.13 --force-with-lease
