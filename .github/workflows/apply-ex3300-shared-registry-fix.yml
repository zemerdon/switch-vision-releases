name: Apply EX3300 shared registry fix

on:
  push:
    branches:
      - audit/ex3300-shared-registry-fix
    paths:
      - tools/apply_ex3300_shared_registry_fix.py
      - .github/workflows/apply-ex3300-shared-registry-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4
        with:
          ref: audit/ex3300-shared-registry-fix
          fetch-depth: 0
          persist-credentials: true

      - name: Apply shared registry correction
        run: python3 tools/apply_ex3300_shared_registry_fix.py

      - name: Commit shared registry correction
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No registry changes required."
            exit 0
          fi
          git config user.name "switch-vision-bot"
          git config user.email "switch-vision-bot@users.noreply.github.com"
          git add src/devices/supported_devices.json
          git commit -m "Correct EX3300 shared physical port contract"
          git push origin HEAD:audit/ex3300-shared-registry-fix
