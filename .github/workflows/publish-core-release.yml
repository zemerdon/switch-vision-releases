name: Publish Core Release

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
    branches:
      - main

permissions:
  contents: read

jobs:
  preflight:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'release/core-')
    name: Core release preflight
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.request.outputs.version }}
      target_sha: ${{ steps.request.outputs.target_sha }}
      publish: ${{ steps.request.outputs.publish }}
      title: ${{ steps.request.outputs.title }}
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}

    steps:
      - name: Checkout release request
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release request
        id: request
        shell: bash
        run: |
          set -euo pipefail

          test -f .sv-release-request.json

          git fetch origin main --tags
          mapfile -t changed < <(git diff --name-only "$BASE_SHA...HEAD")
          if [ "${#changed[@]}" -ne 1 ] || [ "${changed[0]}" != ".sv-release-request.json" ]; then
            echo "ERROR: release-request PR must change only .sv-release-request.json"
            printf 'Changed: %s\n' "${changed[@]}"
            exit 1
          fi

          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import re
          from pathlib import Path

          data = json.loads(Path('.sv-release-request.json').read_text(encoding='utf-8'))
          version = str(data.get('version') or '').strip().lstrip('v')
          target = str(data.get('target_sha') or '').strip()
          publish = data.get('publish', False)
          title = str(data.get('title') or f'Switch Vision Core v{version}').strip()

          if not re.fullmatch(r'\d+\.\d+\.\d+', version):
              raise SystemExit('ERROR: request.version must be an exact semantic version')
          if not re.fullmatch(r'[0-9a-f]{40}', target):
              raise SystemExit('ERROR: request.target_sha must be a full 40-character commit SHA')
          if not isinstance(publish, bool):
              raise SystemExit('ERROR: request.publish must be true or false')
          if not title or '\n' in title or '\r' in title:
              raise SystemExit('ERROR: request.title must be a single non-empty line')

          print(f'version={version}')
          print(f'target_sha={target}')
          print(f'publish={str(publish).lower()}')
          print(f'title={title}')
          PY

          TARGET_SHA="$(python3 -c 'import json; print(json.load(open(".sv-release-request.json"))["target_sha"])')"
          git cat-file -e "$TARGET_SHA^{commit}"
          git merge-base --is-ancestor "$TARGET_SHA" "$BASE_SHA"

          PUBLISH="$(python3 -c 'import json; print(str(bool(json.load(open(".sv-release-request.json")).get("publish", False))).lower())')"
          if [ "$PUBLISH" = "true" ] && [ "$TARGET_SHA" != "$BASE_SHA" ]; then
            echo "ERROR: publish requests must target the exact main SHA used as the PR base"
            echo "target=$TARGET_SHA base=$BASE_SHA"
            exit 1
          fi

      - name: Checkout exact release target
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ steps.request.outputs.target_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install build dependency
        run: python3 -m pip install --disable-pip-version-check PyYAML

      - name: Build and validate exact target
        shell: bash
        env:
          VERSION: ${{ steps.request.outputs.version }}
        run: |
          set -euo pipefail

          test "$(cat VERSION)" = "$VERSION"
          python3 build.py -v "$VERSION"
          git diff --exit-code

          node --check src/js/switch-vision.js
          node --check src/custom_components/switch_vision/switch-vision-card.js
          node --check src/custom_components/switch_vision/switch-vision-panel.js
          node --check src/custom_components/switch_vision/switch-vision-dashboard-strategy.js
          python3 tools/check_core_release_parity.py
          python3 tests/test_release_metadata_contract.py

          test -f "Releases/switch-vision-$VERSION.zip"
          test -f "Releases/switch-vision-$VERSION.zip.sha256"
          test -f "Switch_Vision_v${VERSION}_source.zip"

          expected="$(awk '{print $1}' "Releases/switch-vision-$VERSION.zip.sha256")"
          actual="$(sha256sum "Releases/switch-vision-$VERSION.zip" | awk '{print $1}')"
          test "$actual" = "$expected"

          echo "Core release preflight for $VERSION: PASS"

      - name: Stage immutable publication payload
        if: ${{ steps.request.outputs.publish == 'true' }}
        shell: bash
        env:
          VERSION: ${{ steps.request.outputs.version }}
        run: |
          set -euo pipefail
          payload="$RUNNER_TEMP/core-release-payload"
          rm -rf "$payload"
          mkdir -p "$payload"
          cp "Releases/switch-vision-$VERSION.zip" "$payload/"
          cp "Releases/switch-vision-$VERSION.zip.sha256" "$payload/"
          cp "Switch_Vision_v${VERSION}_source.zip" "$payload/"
          cp RELEASE_NOTES.md "$payload/"

      - name: Upload publication payload
        if: ${{ steps.request.outputs.publish == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: core-release-${{ steps.request.outputs.version }}
          path: ${{ runner.temp }}/core-release-payload
          if-no-files-found: error
          retention-days: 1

      - name: Dry-run complete
        if: ${{ steps.request.outputs.publish != 'true' }}
        run: |
          echo "Core release workflow DRY RUN: PASS"
          echo "version=${{ steps.request.outputs.version }}"
          echo "target=${{ steps.request.outputs.target_sha }}"

  publish:
    name: Publish Core release
    needs: preflight
    if: needs.preflight.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.preflight.outputs.version }}
      TARGET_SHA: ${{ needs.preflight.outputs.target_sha }}
      RELEASE_TITLE: ${{ needs.preflight.outputs.title }}

    steps:
      - name: Download validated publication payload
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: core-release-${{ needs.preflight.outputs.version }}
          path: release-payload

      - name: Verify publication payload
        shell: bash
        run: |
          set -euo pipefail
          cd release-payload

          test -f "switch-vision-$VERSION.zip"
          test -f "switch-vision-$VERSION.zip.sha256"
          test -f "Switch_Vision_v${VERSION}_source.zip"
          test -f RELEASE_NOTES.md

          expected="$(awk '{print $1}' "switch-vision-$VERSION.zip.sha256")"
          actual="$(sha256sum "switch-vision-$VERSION.zip" | awk '{print $1}')"
          test "$actual" = "$expected"

      - name: Publish and verify release
        shell: bash
        run: |
          set -euo pipefail
          cd release-payload

          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "ERROR: GitHub Release $VERSION already exists"
            exit 1
          fi
          if gh api "repos/$GH_REPO/git/ref/tags/$VERSION" >/dev/null 2>&1; then
            echo "ERROR: tag $VERSION already exists"
            exit 1
          fi

          assets=(
            "switch-vision-$VERSION.zip"
            "switch-vision-$VERSION.zip.sha256"
            "Switch_Vision_v${VERSION}_source.zip"
          )

          gh release create "$VERSION" \
            --repo "$GH_REPO" \
            --target "$TARGET_SHA" \
            --title "$RELEASE_TITLE" \
            --notes-file RELEASE_NOTES.md \
            "${assets[@]}"

          current_assets="$(gh release view "$VERSION" --repo "$GH_REPO" --json assets --jq '.assets[].name')"
          for name in \
            "switch-vision-$VERSION.zip" \
            "switch-vision-$VERSION.zip.sha256" \
            "Switch_Vision_v${VERSION}_source.zip"; do
            grep -Fxq "$name" <<<"$current_assets"
          done

          asset_count="$(printf '%s\n' "$current_assets" | sed '/^$/d' | wc -l)"
          test "$asset_count" -eq 3

          ref_type="$(gh api "repos/$GH_REPO/git/ref/tags/$VERSION" --jq '.object.type')"
          ref_sha="$(gh api "repos/$GH_REPO/git/ref/tags/$VERSION" --jq '.object.sha')"
          test "$ref_type" = "commit"
          test "$ref_sha" = "$TARGET_SHA"
          test "$(gh release view "$VERSION" --repo "$GH_REPO" --json isDraft --jq '.isDraft')" = "false"
          test "$(gh release view "$VERSION" --repo "$GH_REPO" --json isPrerelease --jq '.isPrerelease')" = "false"

          echo "Core release publication for $VERSION: PASS"
