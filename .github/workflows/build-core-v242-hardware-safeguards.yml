name: Build Core v2.4.2 hardware safeguards

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/core-2.4.2-hardware-validation-safeguards' }}
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install build dependency
        run: python3 -m pip install --disable-pip-version-check PyYAML
      - name: Prepare Core 2.4.2 metadata
        run: python3 tools/prepare_core_v242.py
      - name: Build Core 2.4.2
        run: python3 build.py -v 2.4.2
      - name: Validate hardware, resource and speed contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check src/js/switch-vision.js
          node --check src/custom_components/switch_vision/switch-vision-card.js
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 tools/check_core_release_parity.py
          git diff --check
          python3 - <<'PY'
          import json
          import urllib.request
          from pathlib import Path

          version='2.4.2'
          expected_resource=f'/local/switch-vision/js/switch-vision.js?v={version}'
          source=json.loads(Path('src/manifest.json').read_text())
          release=json.loads(Path(f'Releases/switch-vision-{version}/manifest.json').read_text())
          assert source['version']==version
          assert source['resource']==expected_resource
          assert release['version']==version
          assert release['resource']==expected_resource

          sha='cf040dd1363eefa761c91ee864ce53c580ae8425'
          url=f'https://raw.githubusercontent.com/zemerdon/switch-vision-discovery/{sha}/runtime_src/opt/switch-vision/devices/supported_devices.json'
          req=urllib.request.Request(url, headers={'User-Agent':'Switch-Vision-Core-v2.4.2-Verify/1'})
          with urllib.request.urlopen(req, timeout=30) as response:
              discovery=json.loads(response.read().decode('utf-8'))
          core=json.loads(Path('src/devices/supported_devices.json').read_text())
          d={str(x.get('model')):x for x in discovery['devices'] if isinstance(x,dict)}
          c={str(x.get('model')):x for x in core['devices'] if isinstance(x,dict)}
          assert set(c)==set(d) and len(c)==28
          targets={'WS-C2960X-24TS-L','WS-C3560CG-8PC-S','SG500X-24','S5735-L8P4X-A1','S5720-12TP-LI-AC'}
          for model in targets:
              assert c[model]['status']=='community_validated', model
              assert c[model]['status']==d[model]['status'], model
          for model in d:
              if d[model].get('vendor')=='Ubiquiti':
                  for field in ('calibration_profile','default_faceplate'):
                      assert c[model].get(field)==d[model].get(field), (model, field)
                  assert c[model].get('visuals')==d[model].get('visuals'), model
          print('Core 2.4.2 hardware/resource cross-component contracts: PASS')
          PY
      - name: Remove generated archives and temporary builder
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            Releases/switch-vision-2.4.2.zip \
            Releases/switch-vision-2.4.2.zip.sha256 \
            Switch_Vision_v2.4.2_source.zip \
            Switch_Vision_v2.4.2_SHA256SUMS.txt
          rm -f .github/workflows/build-core-v242-hardware-safeguards.yml tools/prepare_core_v242.py
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          git diff --check
      - name: Commit built Core 2.4.2 source
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo 'ERROR: Core 2.4.2 builder produced no changes.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Core v2.4.2: hardware validation safeguards'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
