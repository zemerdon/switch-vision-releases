name: Build Core v2.4.7 audit hardening

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install build dependency
        run: python3 -m pip install --disable-pip-version-check PyYAML

      - name: Prepare Core v2.4.7
        run: python3 tools/prepare_core_v247_audit_hardening.py

      - name: Build Core v2.4.7
        run: python3 build.py -v 2.4.7

      - name: Run every permanent Core regression
        shell: bash
        run: |
          set -euo pipefail
          for test in tests/test_*.py; do
            echo "::group::$test"
            python3 "$test"
            echo "::endgroup::"
          done

      - name: Validate release parity, hygiene and syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check src/js/switch-vision.js
          node --check src/custom_components/switch_vision/switch-vision-card.js
          node --check src/custom_components/switch_vision/switch-vision-panel.js
          node --check src/custom_components/switch_vision/switch-vision-dashboard-strategy.js

          # Validate the built/source tree before syntax compilation creates
          # transient __pycache__ material.
          python3 tools/check_core_release_parity.py
          test "$(cat VERSION)" = "2.4.7"
          test -f Releases/switch-vision-2.4.7/custom_components/switch_vision/__init__.py
          grep -Fq 'async_register_admin_service' Releases/switch-vision-2.4.7/custom_components/switch_vision/__init__.py
          if find src Releases \( -type d -name '__pycache__' -o -type f -name '*.pyc' -o -type f -name '*.pyo' -o -type f -name '.DS_Store' \) | grep -q .; then
            echo 'ERROR: generated cache/junk material found before compile'
            exit 1
          fi

          python3 -m py_compile \
            src/custom_components/switch_vision/__init__.py \
            src/custom_components/switch_vision/config_flow.py \
            src/devices/generate_supported_devices.py \
            tests/*.py

          # py_compile intentionally creates cache files; remove only those
          # transient validation artifacts before the clean-tree check.
          find src tests -type d -name '__pycache__' -prune -exec rm -rf {} +
          find src tests -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          git diff --check

      - name: Commit tested product source to feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'switch-vision-release-bot'
          git config user.email 'switch-vision@users.noreply.github.com'
          # Keep workflow files unchanged. Permanent CI wiring and removal of
          # this temporary builder are applied afterward by user-authored commits.
          git checkout HEAD -- .github/workflows/build-core-v247-audit-hardening.yml .github/workflows/validate-core-source.yml
          rm -f tools/prepare_core_v247_audit_hardening.py
          rm -f Releases/switch-vision-2.4.7.zip Releases/switch-vision-2.4.7.zip.sha256 Switch_Vision_v2.4.7_source.zip Switch_Vision_v2.4.7_SHA256SUMS.txt
          git add -A
          git commit -m 'Release Switch Vision Core v2.4.7'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
