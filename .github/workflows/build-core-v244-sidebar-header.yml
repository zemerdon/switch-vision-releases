name: Build Core v2.4.4 sidebar and Native header

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python3 -m pip install --disable-pip-version-check PyYAML
      - name: Prepare Core v2.4.4
        run: |
          set -euo pipefail
          python3 tools/prepare_core_v244.py
          python3 tools/patch_core_v244_sidebar_migration.py
      - name: Build Core v2.4.4
        run: python3 build.py -v 2.4.4
      - name: Validate source
        run: |
          set -euo pipefail
          python3 -m py_compile \
            src/custom_components/switch_vision/__init__.py \
            src/custom_components/switch_vision/config_flow.py
          node --check src/js/switch-vision.js
          node --check src/custom_components/switch_vision/switch-vision-card.js
          node --check src/custom_components/switch_vision/switch-vision-panel.js
          node --check src/custom_components/switch_vision/switch-vision-dashboard-strategy.js
          python3 tests/test_device_registry_contracts.py
          python3 tests/test_huawei_visual_defaults.py
          python3 tests/test_speed_formatting.py
          python3 tests/test_sidebar_header_contracts.py
          find src Releases -type d -name '__pycache__' -prune -exec rm -rf {} + || true
          find src Releases -type f \( -name '*.pyc' -o -name '*.pyo' -o -name '.DS_Store' \) -delete
          python3 tools/check_core_release_parity.py
          git diff --check
      - name: Validate source hygiene
        run: |
          set -euo pipefail
          if find src Releases \
            \( -type d -name '__pycache__' -o -type f -name '*.pyc' -o -type f -name '*.pyo' -o -type f -name '.DS_Store' \) \
            | grep -q .; then
            echo 'ERROR: generated cache/junk material found'
            exit 1
          fi
          python3 tools/check_core_release_parity.py
      - name: Commit final source back to feature branch
        run: |
          set -euo pipefail
          git config user.name 'switch-vision-release-bot'
          git config user.email 'switch-vision@users.noreply.github.com'
          rm -f \
            .github/workflows/build-core-v244-sidebar-header.yml \
            tools/prepare_core_v244.py \
            tools/patch_core_v244_sidebar_migration.py
          rm -f \
            Releases/switch-vision-2.4.4.zip \
            Releases/switch-vision-2.4.4.zip.sha256 \
            Switch_Vision_v2.4.4_source.zip \
            Switch_Vision_v2.4.4_SHA256SUMS.txt
          git add -A
          git commit -m 'Release Switch Vision Core v2.4.4'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
