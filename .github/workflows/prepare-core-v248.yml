name: Build Core v2.4.8 negotiated SFP speed fix

on:
  push:
    branches:
      - fix/core-2.4.8-sfp-negotiated-speed-label

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install build dependency
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Prepare Core v2.4.8 source
        run: python tools/prepare_core_v248.py

      - name: Remove one-shot builder files before packaging
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/prepare_core_v248.py .github/workflows/prepare-core-v248.yml

      - name: Build Core v2.4.8
        run: python build.py -v 2.4.8

      - name: Validate JavaScript syntax
        run: |
          node --check src/js/switch-vision.js
          node --check src/custom_components/switch_vision/switch-vision-card.js
          node --check src/custom_components/switch_vision/switch-vision-panel.js
          node --check src/custom_components/switch_vision/switch-vision-dashboard-strategy.js

      - name: Run permanent Core regression suite
        shell: bash
        run: |
          set -euo pipefail
          for test in tests/test_*.py; do
            echo "::group::$test"
            PYTHONDONTWRITEBYTECODE=1 python "$test"
            echo "::endgroup::"
          done

      - name: Validate Core source/release parity
        run: PYTHONDONTWRITEBYTECODE=1 python tools/check_core_release_parity.py

      - name: Remove generated package artifacts from tracked source
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            Releases/switch-vision-2.4.8.zip \
            Releases/switch-vision-2.4.8.zip.sha256 \
            Switch_Vision_v2.4.8_source.zip \
            Switch_Vision_v2.4.8_SHA256SUMS.txt
          find src tests tools -type d -name '__pycache__' -prune -exec rm -rf {} +
          find src tests tools -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          git diff --check

      - name: Commit tested Core v2.4.8 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'switch-vision-release-bot'
          git config user.email 'switch-vision@users.noreply.github.com'
          git add -A
          git commit -m 'Release Switch Vision Core v2.4.8'
          git push origin HEAD:fix/core-2.4.8-sfp-negotiated-speed-label
