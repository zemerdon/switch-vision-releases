name: Build Core v2.4.5 Native header hotfix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: python3 -m pip install --disable-pip-version-check PyYAML

      - name: Prepare Core v2.4.5
        run: python3 tools/prepare_core_v245_native_header.py

      - name: Build Core v2.4.5
        run: python3 build.py -v 2.4.5

      - name: Validate source and release tree
        run: |
          set -euo pipefail
          python3 -m py_compile \
            src/custom_components/switch_vision/__init__.py \
            src/custom_components/switch_vision/config_flow.py
          node --check src/js/switch-vision.js
          node --check src/custom_components/switch_vision/switch-vision-card.js
          node --check src/custom_components/switch_vision/switch-vision-panel.js
          node --check src/custom_components/switch_vision/switch-vision-dashboard-strategy.js
          python3 tests/test_device_registry_contracts.py
          python3 tests/test_huawei_visual_defaults.py
          python3 tests/test_speed_formatting.py
          python3 tests/test_sidebar_header_contracts.py
          grep -Fq 'const PANEL_VERSION = "2.4.5";' src/custom_components/switch_vision/switch-vision-panel.js
          grep -Fq 'window.dispatchEvent(new CustomEvent("location-changed"' src/custom_components/switch_vision/switch-vision-panel.js
          grep -Fq 'checkbox.type = "checkbox"' src/custom_components/switch_vision/switch-vision-panel.js
          grep -Fq '_resolve_switch_vision_app_slug' src/custom_components/switch_vision/__init__.py
          ! grep -Fq 'hass-navigate' src/custom_components/switch_vision/switch-vision-panel.js
          ! grep -Fq 'dragstart' src/custom_components/switch_vision/switch-vision-panel.js
          find src Releases -type d -name '__pycache__' -prune -exec rm -rf {} + || true
          find src Releases -type f \( -name '*.pyc' -o -name '*.pyo' -o -name '.DS_Store' \) -delete
          python3 tools/check_core_release_parity.py
          git diff --check

      - name: Validate deterministic rebuild
        run: |
          set -euo pipefail
          python3 build.py -v 2.4.5
          rm -f \
            Releases/switch-vision-2.4.5.zip \
            Releases/switch-vision-2.4.5.zip.sha256 \
            Switch_Vision_v2.4.5_source.zip \
            Switch_Vision_v2.4.5_SHA256SUMS.txt
          find src Releases -type d -name '__pycache__' -prune -exec rm -rf {} + || true
          find src Releases -type f \( -name '*.pyc' -o -name '*.pyo' -o -name '.DS_Store' \) -delete
          python3 tools/check_core_release_parity.py

      - name: Commit final source back to feature branch
        run: |
          set -euo pipefail
          git config user.name 'switch-vision-release-bot'
          git config user.email 'switch-vision@users.noreply.github.com'
          rm -f \
            .github/workflows/build-core-v245-native-header-hotfix.yml \
            tools/prepare_core_v245_native_header.py
          rm -f \
            Releases/switch-vision-2.4.5.zip \
            Releases/switch-vision-2.4.5.zip.sha256 \
            Switch_Vision_v2.4.5_source.zip \
            Switch_Vision_v2.4.5_SHA256SUMS.txt
          find src Releases -type d -name '__pycache__' -prune -exec rm -rf {} + || true
          find src Releases -type f \( -name '*.pyc' -o -name '*.pyo' -o -name '.DS_Store' \) -delete
          git add -A
          git commit -m 'Release Switch Vision Core v2.4.5'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
