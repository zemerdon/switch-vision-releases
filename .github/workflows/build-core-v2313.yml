name: Build Core v2.3.13

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    if: ${{ github.event.head_commit.message == '[SV MAINT] build Core v2.3.13' }}
    name: Build Core v2.3.13 calibration controls
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install build dependency
        run: python3 -m pip install --disable-pip-version-check PyYAML

      - name: Patch, build, validate and push v2.3.13
        shell: bash
        run: |
          set -euo pipefail
          BRANCH='feature/core-2.3.13-calibration-control-placement'
          VERSION='2.3.13'

          git config user.name 'Switch Vision CI'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin "$BRANCH"
          git switch -C "$BRANCH" "origin/$BRANCH"

          python3 <<'PY'
          from pathlib import Path
          import json
          import re

          js_path = Path('src/js/switch-vision.js')
          text = js_path.read_text(encoding='utf-8')

          old_default = 'calibration_button: { show: true, x: 1888, y: 14, width: 138, height: 34, anchor: "top_right" },'
          new_default = 'calibration_button: { show: true, x: 1888, y: 372, width: 138, height: 34, anchor: "top_right" },'
          count = text.count(old_default)
          if count != 1:
              raise SystemExit(f'STOP: expected one canonical calibration button default, found {count}')
          text = text.replace(old_default, new_default, 1)

          migration_old = '  cal.ui.calibration_button = { ...defaults.calibration_button, ...(cal.ui.calibration_button || {}) };'
          migration_new = '''  cal.ui.calibration_button = { ...defaults.calibration_button, ...(cal.ui.calibration_button || {}) };
          const calibrationButtonUi = cal.ui.calibration_button;
          if (
            Number(calibrationButtonUi.x) === 1888
            && Number(calibrationButtonUi.y) === 14
            && Number(calibrationButtonUi.width) === 138
            && Number(calibrationButtonUi.height) === 34
          ) {
            calibrationButtonUi.y = 372;
          }'''
          count = text.count(migration_old)
          if count != 1:
              raise SystemExit(f'STOP: expected one calibration button normalisation point, found {count}')
          text = text.replace(migration_old, migration_new, 1)

          test_mode_pattern = re.compile(
              r'    const testModeActive = calibrationTestModeEnabled\(this\.config\);\n'
              r'.*?'
              r'    const testModeBadge = testModeActive\n'
              r'.*?'
              r'      : "";',
              re.S,
          )
          test_mode_replacement = '''    const testModeActive = calibrationTestModeEnabled(this.config);
          const testModeBelow = y + height + 4;
          const testModeTop = (testModeBelow + height <= designHeight - 4)
            ? testModeBelow
            : Math.max(4, y - height - 4);
          const testModeStyle = [
            `left:${(x / designWidth) * 100}%`,
            `top:${(testModeTop / designHeight) * 100}%`,
            `width:${(width / designWidth) * 100}%`,
            `height:${(height / designHeight) * 100}%`,
            "right:auto",
            "z-index:16",
            "pointer-events:none"
          ].join(";");
          const testModeBadge = testModeActive
            ? `<div class="cv-cal-toggle cv-cal-test-mode-badge is-active" style="${testModeStyle}" title="Calibration LED Test Mode is active">TEST MODE</div>`
            : "";'''
          text, count = test_mode_pattern.subn(test_mode_replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'STOP: expected one persistent Test Mode renderer, found {count}')

          js_path.write_text(text, encoding='utf-8')

          moved = []
          for path in sorted(Path('src/calibration').glob('*.json')):
              data = json.loads(path.read_text(encoding='utf-8'))
              ui = data.get('ui') if isinstance(data, dict) else None
              button = ui.get('calibration_button') if isinstance(ui, dict) else None
              if not isinstance(button, dict):
                  continue
              if (
                  float(button.get('x', -1)) == 1888
                  and float(button.get('y', -1)) == 14
                  and float(button.get('width', -1)) == 138
                  and float(button.get('height', -1)) == 34
              ):
                  button['y'] = 372
                  path.write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')
                  moved.append(str(path))
          if not moved:
              raise SystemExit('STOP: no stock calibration-button placements were updated')
          print('Moved stock calibration controls:', ', '.join(moved))

          release_notes = '''# Switch Vision Core v2.3.13 — Bottom-right Calibration controls

Switch Vision Core v2.3.13 polishes the persistent Calibration LED Test Mode controls introduced in v2.3.12.

## Cleaner bottom-right placement

The stock **Calibrate** control now sits in the lower-right faceplate control area instead of covering the upper-right screw/hardware detail.

When Calibration LED Test Mode is active, **TEST MODE** is displayed directly beneath Calibrate as a full-size matching control.

The two controls now form a clean vertical stack:

- Calibrate: 138 × 34
- TEST MODE: 138 × 34
- 4 px spacing between the controls

Existing profiles that still use the previous stock Calibrate coordinates are automatically moved to the new stock position. Profiles with genuinely customised Calibrate coordinates are left unchanged.

## Behaviour unchanged

This release does not change Test Mode logic introduced in v2.3.12:

- Done saves and closes Calibration while Test Mode remains active
- reopening Calibration preserves Test Mode
- Cancel closes Calibration and turns Test Mode off
- forced Status, RJ45, and SFP/uplink LED states remain unchanged

No Discovery, physical-port mapping, faceplate assignment, telemetry, calibration geometry, or Activity LED tuning behaviour is changed.

## Upgrade note

Switch Vision Core v2.3.13 changes the Home Assistant custom integration/card files and versioned frontend resources.

After updating Core through Switch Vision Installer, restart Home Assistant Core when prompted.
'''
          Path('RELEASE_NOTES.md').write_text(release_notes, encoding='utf-8')

          changelog_path = Path('CHANGELOG.md')
          changelog = changelog_path.read_text(encoding='utf-8')
          heading = '## v2.3.13 — Bottom-right Calibration controls'
          if heading not in changelog:
              marker = '# Changelog\n\n'
              if not changelog.startswith(marker):
                  raise SystemExit('STOP: unexpected CHANGELOG.md header')
              entry = '''## v2.3.13 — Bottom-right Calibration controls

- Moves the stock Calibrate control to the lower-right faceplate control area so the upper-right screw/hardware remains visible.
- Displays persistent TEST MODE directly beneath Calibrate using the same 138 × 34 control size and a 4 px gap.
- Reuses the normal Calibrate control styling so the two controls read as one intentional vertical control stack.
- Automatically relocates profiles still using the previous exact stock Calibrate coordinates while preserving genuinely customised positions.
- Keeps all v2.3.12 persistent Test Mode behaviour unchanged.
- Does not change Discovery, physical-port mappings, faceplate assignments, telemetry, calibration geometry, or Activity LED tuning.
- Changes the Home Assistant custom integration/card files; restart Home Assistant Core after updating.


'''
              changelog_path.write_text(marker + entry + changelog[len(marker):], encoding='utf-8')
          PY

          node --check src/js/switch-vision.js
          git diff --check

          python3 build.py -v "$VERSION"

          rm -f \
            "Releases/switch-vision-$VERSION.zip" \
            "Releases/switch-vision-$VERSION.zip.sha256" \
            "Switch_Vision_v${VERSION}_source.zip" \
            "Switch_Vision_v${VERSION}_SHA256SUMS.txt"

          if find src "Releases/switch-vision-$VERSION" \
            \( -type d -name '__pycache__' -o -type f -name '*.pyc' -o -type f -name '*.pyo' -o -type f -name '.DS_Store' \) \
            | grep -q .; then
            echo 'STOP: generated cache/junk material found after build'
            exit 1
          fi

          test "$(cat VERSION)" = "$VERSION"
          test -d "Releases/switch-vision-$VERSION"
          node --check src/js/switch-vision.js
          python3 tools/check_core_release_parity.py
          git diff --check

          git add -A
          if git diff --cached --name-only | grep -E '\.(zip|pyc|pyo)$|SHA256SUMS|\.zip\.sha256$'; then
            echo 'STOP: archive/checksum/cache output was staged'
            exit 1
          fi
          git diff --cached --check
          git commit -m 'Build Switch Vision Core v2.3.13'
          git push origin "HEAD:$BRANCH"
