name: Apply SV-2026-000002 Review Patch

on:
  push:
    branches:
      - review/sv-2026-000002-unifi-mapping

permissions:
  contents: write

jobs:
  apply-review-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout review branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install review dependencies
        run: python3 -m pip install --disable-pip-version-check PyYAML ruamel.yaml

      - name: Apply exact-tree review patch
        run: python3 tools/apply_sv_2026_000002_review.py

      - name: Rebuild current review version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(cat VERSION)"
          python3 build.py -v "$VERSION"
          rm -f \
            "Releases/switch-vision-$VERSION.zip" \
            "Releases/switch-vision-$VERSION.zip.sha256" \
            "Switch_Vision_v${VERSION}_source.zip" \
            "Switch_Vision_v${VERSION}_SHA256SUMS.txt"

      - name: Run focused contribution regressions
        shell: bash
        run: |
          set -euo pipefail
          node --check src/js/switch-vision.js
          node --check src/custom_components/switch_vision/switch-vision-card.js
          python3 tests/test_unifi_api_port_mapping.py
          python3 tests/test_speed_formatting.py
          python3 tests/test_device_registry_contracts.py
          git diff --check

      - name: Commit verified review result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "switch-vision-review-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No review changes to commit."
            exit 0
          fi
          git commit -m "Implement SV-2026-000002 UniFi mapping contracts"
          git push origin HEAD:review/sv-2026-000002-unifi-mapping
