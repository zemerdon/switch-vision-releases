name: Run Core v2.4.10 Brendan prep

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  prepare:
    if: github.head_ref == 'review/sv-2026-000034-000036-brendan-unifi'
    runs-on: ubuntu-latest
    steps:
      - name: Check out review head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: review/sv-2026-000034-000036-brendan-unifi
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install build dependency
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Execute guarded prep payload
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          python3 - <<'PYRUNNER'
          from pathlib import Path
          import re

          workflow = Path('.github/workflows/prepare-core-v2410-brendan.yml')
          text = workflow.read_text(encoding='utf-8')
          match = re.search(r"^          python3 - <<'PY'\n(.*?)^          PY$", text, re.M | re.S)
          if not match:
              raise SystemExit('Core prep payload not found')
          payload = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in match.group(1).splitlines()
          )
          exec(compile(payload, str(workflow), 'exec'), {'__name__': '__main__'})

          # Core's permanent UniFi visual contract requires dashboard-disabled
          # exact models with no visual to remain detected. Promote only the
          # Pro Max 24 contract to experimental because its 24+2 visual is safe.
          registry_path = Path('src/devices/supported_devices.yaml')
          registry_text = registry_path.read_text(encoding='utf-8')
          starts = [m.start() for m in re.finditer(r'(?m)^- status: experimental\n  confirmed_since: 2\.4\.10$', registry_text)]
          starts.append(len(registry_text))
          pending = {'UCG Ultra', 'US 16 PoE 150W', 'USW Ultra'}
          rebuilt = []
          cursor = 0
          for index in range(len(starts) - 1):
              start = starts[index]
              end = starts[index + 1]
              rebuilt.append(registry_text[cursor:start])
              segment = registry_text[start:end]
              model_match = re.search(r'(?m)^  model: (.+)$', segment)
              model = model_match.group(1).strip() if model_match else ''
              if model in pending:
                  segment = segment.replace('- status: experimental\n', '- status: detected\n', 1)
              rebuilt.append(segment)
              cursor = end
          rebuilt.append(registry_text[cursor:])
          registry_path.write_text(''.join(rebuilt), encoding='utf-8', newline='\n')

          test_path = Path('tests/test_brendan_unifi_contracts.py')
          test_text = test_path.read_text(encoding='utf-8')
          test_text = test_text.replace(
              '    assert item["status"] == "experimental", model\n',
              '    expected_status = "experimental" if model == "USW Pro Max 24" else "detected"\n'
              '    assert item["status"] == expected_status, model\n',
              1,
          )
          test_path.write_text(test_text, encoding='utf-8', newline='\n')
          PYRUNNER
          rm -f \
            .github/workflows/prepare-core-v2410-brendan.yml \
            .github/workflows/run-core-v2410-brendan-prep.yml

      - name: Build and validate Core 2.4.10
        shell: bash
        run: |
          set -euo pipefail
          python build.py -v 2.4.10
          node --check src/js/switch-vision.js
          node --check src/custom_components/switch_vision/switch-vision-card.js
          node --check src/custom_components/switch_vision/switch-vision-panel.js
          node --check src/custom_components/switch_vision/switch-vision-dashboard-strategy.js
          for test in tests/test_*.py; do
            echo "::group::$test"
            PYTHONDONTWRITEBYTECODE=1 python "$test"
            echo "::endgroup::"
          done
          PYTHONDONTWRITEBYTECODE=1 python tools/check_core_release_parity.py
          rm -f \
            Releases/switch-vision-2.4.10.zip \
            Releases/switch-vision-2.4.10.zip.sha256 \
            Switch_Vision_v2.4.10_source.zip \
            Switch_Vision_v2.4.10_SHA256SUMS.txt
          find src tests tools -type d -name '__pycache__' -prune -exec rm -rf {} +
          find src tests tools -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          test "$(cat VERSION)" = "2.4.10"
          test -d Releases/switch-vision-2.4.10
          git diff --quiet origin/main -- Releases/switch-vision-2.4.9
          git diff --check

      - name: Commit tested Core review source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'switch-vision-release-bot'
          git config user.email 'switch-vision@users.noreply.github.com'
          git add -A
          git commit -m 'Prepare Switch Vision Core v2.4.10 Brendan UniFi contracts'
          git push origin HEAD:review/sv-2026-000034-000036-brendan-unifi
