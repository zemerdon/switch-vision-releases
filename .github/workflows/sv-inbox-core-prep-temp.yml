name: Temporary Core inbox-audit preparer
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sv-inbox-core-prep-temp.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/inbox-audit-core-2.4.13
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare Core 2.4.13 inbox-audit review
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check pyyaml
          python - <<'PY'
          from copy import deepcopy
          from pathlib import Path
          import yaml

          # Jan/Pedro: ports with older/custom calibration geometry can still be
          # selectable even when a hitbox value is absent.
          card = Path('src/custom_components/switch_vision/switch-vision-card.js')
          s = card.read_text()
          old = '''    const addHitbox = (type, id, item) => {
              if (!item?.center || !item?.hitbox) return;

              const [cx, cy] = item.center;
              const [w, h] = visualHitboxSize(type, item.hitbox);'''
          new = '''    const addHitbox = (type, id, item) => {
              if (!item?.center) return;

              const [cx, cy] = item.center;
              // Older/custom calibration profiles may omit an explicit hitbox.
              // The visual can still render from center/LED coordinates, so do not
              // make that port silently unclickable and fall back to switch summary.
              const fallbackHitbox = type === "port" ? [34, 56] : [94, 48];
              const [w, h] = visualHitboxSize(type, item.hitbox || fallbackHitbox);'''
          if old not in s:
              raise SystemExit('Core selection hitbox block not found')
          card.write_text(s.replace(old, new, 1))

          # Jan/Pedro: the native Advanced diagnostics block has a fixed dark
          # background, so give it a fixed readable foreground instead of
          # inheriting a theme that may define primary text as black.
          panel = Path('src/custom_components/switch_vision/switch-vision-panel.js')
          s = panel.read_text()
          old = '.meta{font-family:monospace;white-space:pre-wrap;word-break:break-word;background:#0d1216;padding:12px;border-radius:8px;max-height:320px;overflow:auto}'
          new = '.meta{font-family:monospace;white-space:pre-wrap;word-break:break-word;background:#0d1216;color:#e8eef3;padding:12px;border-radius:8px;max-height:320px;overflow:auto}'
          if old not in s:
              raise SystemExit('Core native-panel meta style block not found')
          panel.write_text(s.replace(old, new, 1))

          # Jason SV-2026-000009: add exact UCG Fiber hardware/API contract and
          # retain anonymous contributor handling. Start from the established UCG
          # Ultra gateway/switch-hybrid policy, then replace all model evidence.
          registry_path = Path('src/devices/supported_devices.yaml')
          doc = yaml.safe_load(registry_path.read_text())
          devices = doc['devices']
          if any(d.get('model') == 'UCG Fiber' for d in devices):
              raise SystemExit('UCG Fiber already exists unexpectedly')
          ultra = next(d for d in devices if d.get('model') == 'UCG Ultra')
          fiber = deepcopy(ultra)
          fiber.update({
              'vendor': 'Ubiquiti',
              'family': 'UniFi Cloud Gateway Fiber',
              'model': 'UCG Fiber',
              'status': 'experimental',
              'confirmed_since': '2.4.13',
              'last_validated_version': '2.4.13',
              'evidence': 'support_my_switch_anonymous_real_hardware_api_capture_2026-08-23',
              'ports': {
                  'rj45': 5,
                  'poe': True,
                  'uplinks': 2,
                  'uplink_type': '10G SFP+',
                  'gigabit_sfp': 0,
                  'ten_gigabit_sfp_plus': 2,
              },
              'stack_support': False,
              'discovery_support': True,
              'dashboard_support': False,
              'mapping_profile': 'ubiquiti-ucg-fiber-api',
              'calibration_profile': '',
              'default_faceplate': '',
              'optional_faceplates': [],
              'tested_firmware': ['5.1.31'],
              'contributor': {'display_name': 'community contributor', 'public_credit': False},
              'contributions': [{
                  'id': 'community validation',
                  'source_component': 'UniFi2MQTT 2.0.47',
                  'source_discovery': '2.1.40',
                  'contributor': {'display_name': 'community contributor', 'public_credit': False},
                  'api_capabilities': {'port_detail': True, 'per_port_traffic': False},
              }],
              'notes': [
                  'Anonymous real-hardware UniFi API evidence exposes ports 1-4 as 2.5G-capable RJ45, port 5 as 10G-capable RJ45, and ports 6-7 as 10G SFP+.',
                  'PoE+ output capability is exposed on physical/API port 4 only; ports 1-3 and port 5 do not report PoE output capability.',
                  'The device is a Cloud Gateway with integrated switching. Switch Vision preserves all seven physical/API interfaces without inferring WAN/LAN role from physical position.',
                  'Maximum connector capability remains separate from negotiated speed; the contributed 10G RJ45 port was linked at 2.5G while an SFP+ port was linked at 10G.',
                  'Port detail is available while per-port RX/TX traffic is unavailable through the contributed UniFi API path.',
                  'Model-specific artwork is not yet validated; exact dashboard visual support remains pending rather than substituting inaccurate artwork.',
              ],
              'validation': {
                  'exact_model_detection': 'contribution_confirmed',
                  'rj45_mapping': 'ports_1_4_2_5g_port_5_10g_contribution_confirmed',
                  'poe': 'port_4_802_3at_output_only_contribution_confirmed',
                  'system_sensors': 'contribution_confirmed',
                  'uplinks': 'ports_6_7_10g_sfp_plus_contribution_confirmed',
                  'stack': 'not_applicable',
              },
          })
          fiber['visuals'] = deepcopy(ultra['visuals'])
          fiber['visuals']['status'] = 'pending'
          fiber['visuals']['recommended_faceplate'] = ''
          fiber['visuals']['optional_faceplates'] = []
          fiber['visuals']['calibration_profile'] = ''

          # Insert beside UCG Ultra to keep registry review readable.
          idx = devices.index(ultra)
          devices.insert(idx + 1, fiber)

          # Jason's Pro XG 8 PoE capture corroborates the existing exact contract.
          xg = next(d for d in devices if d.get('model') == 'USW Pro XG 8 PoE')
          if 'support_my_switch_anonymous_hardware_capture_2026-08-23' not in str(xg.get('evidence', '')):
              xg['evidence'] = str(xg.get('evidence', '')).rstrip('; ') + '; support_my_switch_anonymous_hardware_capture_2026-08-23'
          fw = list(xg.get('tested_firmware') or [])
          if '7.5.10' not in fw:
              fw.append('7.5.10')
          xg['tested_firmware'] = fw
          notes = list(xg.get('notes') or [])
          note = 'Anonymous real-hardware evidence additionally confirms a 10G-capable RJ45 port negotiating at 2.5G, PoE capability independent of PoE-active state, and a 10G SFP+ live link.'
          if note not in notes:
              notes.append(note)
          xg['notes'] = notes

          registry_path.write_text(yaml.safe_dump(doc, sort_keys=False, allow_unicode=True), encoding='utf-8')

          # Permanent regressions for both inbox fixes and UCG Fiber.
          Path('tests/test_inbox_ui_regressions.py').write_text('''from pathlib import Path\n\nROOT = Path(__file__).resolve().parents[1]\ncard = (ROOT / "src/custom_components/switch_vision/switch-vision-card.js").read_text(encoding="utf-8")\npanel = (ROOT / "src/custom_components/switch_vision/switch-vision-panel.js").read_text(encoding="utf-8")\n\nassert "if (!item?.center) return;" in card\nassert "if (!item?.center || !item?.hitbox) return;" not in card\nassert 'const fallbackHitbox = type === "port" ? [34, 56] : [94, 48];' in card\nassert "visualHitboxSize(type, item.hitbox || fallbackHitbox)" in card\nassert "background:#0d1216;color:#e8eef3" in panel\nprint("Switch Vision inbox UI regressions: PASS")\n''', encoding='utf-8')

          Path('tests/test_ucg_fiber_contract.py').write_text('''from pathlib import Path\nimport json\nimport yaml\n\nROOT = Path(__file__).resolve().parents[1]\nyaml_path = ROOT / "src/devices/supported_devices.yaml"\njson_path = ROOT / "src/devices/supported_devices.json"\ndoc = yaml.safe_load(yaml_path.read_text(encoding="utf-8"))\nmodels = {d["model"]: d for d in doc["devices"]}\nf = models["UCG Fiber"]\nassert f["status"] == "experimental"\nassert f["ports"] == {"rj45": 5, "poe": True, "uplinks": 2, "uplink_type": "10G SFP+", "gigabit_sfp": 0, "ten_gigabit_sfp_plus": 2}\nassert f["mapping_profile"] == "ubiquiti-ucg-fiber-api"\nassert f["dashboard_support"] is False\nassert f["default_faceplate"] == "" and f["calibration_profile"] == ""\nassert "port_4_802_3at_output_only" in f["validation"]["poe"]\nassert "ports_6_7_10g_sfp_plus" in f["validation"]["uplinks"]\nassert f["contributor"]["public_credit"] is False\nassert all((c.get("contributor") or {}).get("public_credit") is False for c in f.get("contributions", []))\njson_models = {d["model"]: d for d in json.loads(json_path.read_text(encoding="utf-8"))["devices"]}\nassert json_models["UCG Fiber"] == f\nprint("Switch Vision UCG Fiber exact contract: PASS")\n''', encoding='utf-8')

          entry = '''## 2.4.13 — inbox audit fixes and UCG Fiber\n\n- Fixes port selection for older/custom calibration profiles that omit an explicit hitbox, preventing a rendered port from falling back to switch summary when clicked.\n- Gives the native Advanced diagnostics block an explicit high-contrast foreground so dark diagnostics remain readable under themes such as UniFi.\n- Adds an exact Experimental UCG Fiber hardware/API contract from anonymous real-hardware evidence: 4 x 2.5G RJ45, 1 x 10G RJ45, 2 x 10G SFP+, with PoE+ output on port 4 only.\n- Preserves gateway/switch-hybrid physical-port handling without hard-coding WAN/LAN roles.\n- Records additional real-hardware corroboration for USW Pro XG 8 PoE while keeping it Experimental pending rendered visual validation.\n- Adds permanent inbox UI and UCG Fiber regressions.\n\n'''
          for name in ('CHANGELOG.md', 'src/CHANGELOG.md'):
              p = Path(name); text = p.read_text(); marker = '# Changelog\n\n'
              if marker not in text: raise SystemExit(f'changelog marker missing: {name}')
              p.write_text(text.replace(marker, marker + entry, 1))

          release_notes = '''# Switch Vision 2.4.13\n\nThis maintenance release closes outstanding tester inbox issues and adds the UCG Fiber exact hardware/API contract.\n\n- Older/custom port calibrations remain clickable even when an explicit hitbox is absent.\n- Advanced native-panel diagnostics use a guaranteed readable foreground on their dark code surface.\n- UCG Fiber is added as Experimental with its truthful 5-RJ45 + 2-SFP+ physical/API contract and port-4 PoE+ capability.\n- USW Pro XG 8 PoE gains additional anonymous real-hardware corroboration.\n'''
          Path('RELEASE_NOTES.md').write_text(release_notes, encoding='utf-8')
          Path('src/RELEASE_NOTES.md').write_text(release_notes, encoding='utf-8')
          PY

          python src/devices/generate_supported_devices.py src/devices/supported_devices.yaml src/docs
          python tests/test_inbox_ui_regressions.py
          python tests/test_ucg_fiber_contract.py
          python build.py -v 2.4.13
          python tests/test_inbox_ui_regressions.py
          python tests/test_ucg_fiber_contract.py

          rm -f Releases/switch-vision-2.4.13.zip Releases/switch-vision-2.4.13.zip.sha256
          rm -f Switch_Vision_v2.4.13_source.zip Switch_Vision_v2.4.13_SHA256SUMS.txt

          git config user.name 'Switch Vision Review Builder'
          git config user.email 'switch-vision@users.noreply.github.com'
          git add -A
          git commit -m '[sv-inbox-prepared] Core 2.4.13: close inbox UI gaps and add UCG Fiber'
          git push origin HEAD:review/inbox-audit-core-2.4.13
