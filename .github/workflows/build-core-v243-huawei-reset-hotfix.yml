name: Build Core v2.4.3 Huawei reset hotfix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'hotfix/core-2.4.3-huawei-reset-defaults' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install build dependency
        run: python3 -m pip install --disable-pip-version-check PyYAML
      - name: Prepare Core 2.4.3
        run: python3 tools/prepare_core_v243.py
      - name: Build Core 2.4.3
        run: python3 build.py -v 2.4.3
      - name: Validate Core 2.4.3
        shell: bash
        run: |
          set -euo pipefail
          node --check src/js/switch-vision.js
          node --check src/custom_components/switch_vision/switch-vision-card.js
          node --check src/custom_components/switch_vision/switch-vision-panel.js
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 tools/check_core_release_parity.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          version='2.4.3'
          profile='stock_24rj45_4sfp'
          faceplate='faceplates/24rj45-4sfp.png'
          for path in (Path('src/devices/supported_devices.json'), Path(f'Releases/switch-vision-{version}/devices/supported_devices.json')):
              doc=json.loads(path.read_text())
              models={str(x.get('model')):x for x in doc.get('devices',[]) if isinstance(x,dict)}
              for model in ('S5720-12TP-LI-AC','S5735-L8P4X-A1'):
                  d=models[model]
                  assert d['calibration_profile']==profile
                  assert d['default_faceplate']==faceplate
                  assert d['visuals']['calibration_profile']==profile
                  assert d['visuals']['recommended_faceplate']==faceplate
          src=json.loads(Path('src/manifest.json').read_text())
          rel=json.loads(Path(f'Releases/switch-vision-{version}/manifest.json').read_text())
          expected=f'/local/switch-vision/js/switch-vision.js?v={version}'
          assert src['version']==rel['version']==version
          assert src['resource']==rel['resource']==expected
          print('Core 2.4.3 Huawei reset/default contract: PASS')
          PY
          git diff --check
      - name: Remove generated archives and temporary builder
        shell: bash
        run: |
          set -euo pipefail
          rm -f Releases/switch-vision-2.4.3.zip Releases/switch-vision-2.4.3.zip.sha256 Switch_Vision_v2.4.3_source.zip Switch_Vision_v2.4.3_SHA256SUMS.txt
          rm -f .github/workflows/build-core-v243-huawei-reset-hotfix.yml tools/prepare_core_v243.py
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          git diff --check
      - name: Commit built Core 2.4.3 source
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo 'ERROR: Core 2.4.3 builder produced no changes.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Core v2.4.3: restore Huawei faceplate reset defaults'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
