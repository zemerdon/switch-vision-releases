name: Prepare Core 2.7.9 faceplate repair

on:
  push:
    branches:
      - fix/core-2.7.9-faceplate-matrix

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Prepare and build Core 2.7.9
        run: python tools/prepare_core_279.py

      - name: Validate JavaScript syntax
        run: |
          node --check src/js/switch-vision.js
          node --check src/custom_components/switch_vision/switch-vision-card.js

      - name: Check patch integrity
        run: git diff --check

      - name: Commit prepared 2.7.9 source and release tree
        shell: bash
        run: |
          git config user.name "Switch Vision SV-Dev"
          git config user.email "switch-vision@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No 2.7.9 release changes to commit."
            exit 0
          fi
          git commit -m "Core 2.7.9: build exact model faceplate repair"
          git push origin HEAD:${{ github.ref_name }}
