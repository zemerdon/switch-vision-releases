name: Apply Core faceplate matrix

on:
  push:
    branches:
      - fix/core-2.7.9-faceplate-matrix

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check pyyaml pytest

      - name: Apply exact-model faceplate matrix
        run: python tools/apply_faceplate_matrix.py

      - name: Run exact-model regression
        run: python -m pytest -q tests/test_exact_model_faceplate_matrix.py

      - name: Validate generated registries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml

          root = Path('.')
          yaml_data = yaml.safe_load((root / 'src/devices/supported_devices.yaml').read_text(encoding='utf-8'))
          json_data = json.loads((root / 'src/devices/supported_devices.json').read_text(encoding='utf-8'))
          ymodels = [row.get('model') for row in yaml_data.get('devices', []) if isinstance(row, dict)]
          jmodels = [row.get('model') for row in json_data.get('devices', []) if isinstance(row, dict)]
          if ymodels != jmodels:
              raise SystemExit('YAML/JSON model ordering differs after regeneration')
          print(f'Registry parse/parity: PASS ({len(ymodels)} models)')
          PY

      - name: Check patch integrity
        run: git diff --check

      - name: Commit generated corrections
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No generated corrections to commit."
            exit 0
          fi
          git config user.name "Switch Vision SV-Dev"
          git config user.email "switch-vision@users.noreply.github.com"
          git add src/devices/supported_devices.yaml \
                  src/devices/supported_devices.json \
                  src/docs \
                  src/js/switch-vision.js \
                  src/custom_components/switch_vision/switch-vision-card.js
          git commit -m "Core 2.7.9: correct exact model faceplate mappings"
          git push origin HEAD:${{ github.ref_name }}
