name: Verify Core v2.3.12 Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    if: ${{ github.event.head_commit.message == '[SV VERIFY] Core v2.3.12 release' }}
    name: Verify Core v2.3.12 GitHub release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: "2.3.12"
      PREVIOUS_VERSION: "2.3.11"
      TARGET_SHA: "2f21fa73b3fe3bb52abb278ff446ee98eb00f611"

    steps:
      - name: Checkout main
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: Verify tag, release and assets
        shell: bash
        run: |
          set -euo pipefail

          gh release view "$VERSION" >/dev/null
          current_assets="$(gh release view "$VERSION" --json assets --jq '.assets[].name')"
          previous_assets="$(gh release view "$PREVIOUS_VERSION" --json assets --jq '.assets[].name' 2>/dev/null || true)"

          require_asset() {
            local name="$1"
            if ! grep -Fxq "$name" <<<"$current_assets"; then
              echo "STOP: required release asset missing: $name"
              exit 1
            fi
          }

          require_asset "switch-vision-$VERSION.zip"
          require_asset "switch-vision-$VERSION.zip.sha256"

          if grep -Fxq "Switch_Vision_v${PREVIOUS_VERSION}_source.zip" <<<"$previous_assets"; then
            require_asset "Switch_Vision_v${VERSION}_source.zip"
          fi
          if grep -Fxq "Switch_Vision_v${PREVIOUS_VERSION}_SHA256SUMS.txt" <<<"$previous_assets"; then
            require_asset "Switch_Vision_v${VERSION}_SHA256SUMS.txt"
          fi

          git fetch --force origin "refs/tags/$VERSION:refs/tags/$VERSION"
          tag_commit="$(git rev-parse "$VERSION^{commit}")"
          test "$tag_commit" = "$TARGET_SHA"

          is_draft="$(gh release view "$VERSION" --json isDraft --jq '.isDraft')"
          is_prerelease="$(gh release view "$VERSION" --json isPrerelease --jq '.isPrerelease')"
          test "$is_draft" = "false"
          test "$is_prerelease" = "false"

          {
            echo "Switch Vision Core v$VERSION release verification: PASS"
            echo "tag_commit=$tag_commit"
            echo "assets:"
            printf '%s\n' "$current_assets"
          } > .sv-core-v2312-release-verified

          git config user.name 'Switch Vision CI'
          git config user.email 'actions@users.noreply.github.com'
          git add .sv-core-v2312-release-verified
          git commit -m 'Verify Switch Vision Core v2.3.12 release'
          git push origin HEAD:main
