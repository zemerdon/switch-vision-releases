name: Publish Core v2.3.15

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish:
    if: ${{ github.event.head_commit.message == '[SV RELEASE] publish Core v2.3.15' }}
    name: Publish and verify Core v2.3.15
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: "2.3.15"
      PREVIOUS_VERSION: "2.3.14"
      TARGET_SHA: "f133a60c0fcd7d4a4c234f46525dfff7d5a9b08a"

    steps:
      - name: Checkout clean release commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install build dependency
        run: python3 -m pip install --disable-pip-version-check PyYAML

      - name: Rebuild, publish and verify
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "STOP: GitHub Release $VERSION already exists"
            exit 1
          fi

          python3 build.py -v "$VERSION"
          git diff --exit-code
          node --check src/js/switch-vision.js
          python3 tools/check_core_release_parity.py

          previous_assets="$(gh release view "$PREVIOUS_VERSION" --json assets --jq '.assets[].name' 2>/dev/null || true)"
          assets=(
            "Releases/switch-vision-$VERSION.zip"
            "Releases/switch-vision-$VERSION.zip.sha256"
          )
          if grep -Fxq "Switch_Vision_v${PREVIOUS_VERSION}_source.zip" <<<"$previous_assets"; then
            assets+=("Switch_Vision_v${VERSION}_source.zip")
          fi

          gh release create "$VERSION" \
            --target "$TARGET_SHA" \
            --title "Switch Vision Core v$VERSION — Consistent Test Mode spacing" \
            --notes-file RELEASE_NOTES.md \
            "${assets[@]}"

          current_assets="$(gh release view "$VERSION" --json assets --jq '.assets[].name')"
          grep -Fxq "switch-vision-$VERSION.zip" <<<"$current_assets"
          grep -Fxq "switch-vision-$VERSION.zip.sha256" <<<"$current_assets"
          if grep -Fxq "Switch_Vision_v${PREVIOUS_VERSION}_source.zip" <<<"$previous_assets"; then
            grep -Fxq "Switch_Vision_v${VERSION}_source.zip" <<<"$current_assets"
          fi

          git fetch --force origin "refs/tags/$VERSION:refs/tags/$VERSION"
          tag_commit="$(git rev-parse "$VERSION^{commit}")"
          test "$tag_commit" = "$TARGET_SHA"
          test "$(gh release view "$VERSION" --json isDraft --jq '.isDraft')" = "false"
          test "$(gh release view "$VERSION" --json isPrerelease --jq '.isPrerelease')" = "false"

          git fetch origin main
          git switch -C main origin/main
          {
            echo "Switch Vision Core v$VERSION release verification: PASS"
            echo "tag_commit=$tag_commit"
            echo "assets:"
            printf '%s\n' "$current_assets"
          } > .sv-core-v2315-release-verified

          git config user.name 'Switch Vision CI'
          git config user.email 'actions@users.noreply.github.com'
          git add .sv-core-v2315-release-verified
          git commit -m 'Verify Switch Vision Core v2.3.15 release'
          git push origin HEAD:main
