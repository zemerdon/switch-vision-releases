name: Prepare Core v2.4.9 review release

on:
  push:
    branches:
      - review/sv-2026-000002-unifi-mapping

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Check out review branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install build dependency
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Prepare Core 2.4.9 source and metadata
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main

          # The review branch temporarily mirrored changes into the historical
          # 2.4.8 extracted release. Restore published history before creating
          # the real 2.4.9 release tree.
          git checkout origin/main -- Releases/switch-vision-2.4.8

          python3 - <<'PY'
          from pathlib import Path

          changelog = Path('CHANGELOG.md')
          old = changelog.read_text(encoding='utf-8')
          entry = '''## v2.4.9 — UniFi exact-model API mapping and contribution support

          - Add a backward-compatible explicit UniFi visual-port → API-port mapping contract while preserving the legacy sequential/offset path when no explicit map is present.
          - Add exact-model support for `US 48` using the verified 48 × 1G RJ45 + 2 × 10G SFP+ + 2 × 1G SFP geometry and existing truthful 48+4 visual.
          - Add detected hardware contracts for `US XG 16` (12 × 10G SFP+ followed by 4 × 10G RJ45) and `USW Pro Aggregation` (28 × 10G SFP+ + 4 × 25G SFP28) without inventing unverified dashboard faceplates.
          - Keep maximum port capability separate from current negotiated speed, including 10G-capable RJ45 links negotiating at 1G and 25G-capable SFP28 links negotiating at 10G.
          - Add Support My Switch evidence from `SV-2026-000002` for US 8 60W, USW Flex Mini, and US 48 PoE 500W without over-promoting their validation status; credit `bignick8t3`.
          - Preserve the newer validated Zyxel XS1930-10 `jpedrot` evidence while synchronizing the shared Core/Discovery registry.
          - Add permanent regressions for explicit/legacy UniFi mappings, optical-only calibration, speed presentation, exact-model registry contracts, and preserved Zyxel defaults.

          '''
          # Remove indentation introduced by the YAML block while keeping the
          # human-facing Markdown flush-left.
          entry = '\n'.join(line[10:] if line.startswith('          ') else line for line in entry.splitlines()) + '\n'
          if old.startswith('## v2.4.9'):
              raise SystemExit('Core 2.4.9 changelog already present')
          if not old.startswith('## v2.4.8'):
              raise SystemExit('Unexpected Core changelog head')
          changelog.write_text(entry + old, encoding='utf-8', newline='\n')

          notes = '''# Switch Vision Core v2.4.9

          Core 2.4.9 adds truthful exact-model UniFi API-port mapping from Support My Switch contribution `SV-2026-000002` by **bignick8t3**.

          `US 48` is added with its verified 48 RJ45 + four optical layout. `US XG 16` is recognised with its real optical-first API order (SFP+ 1–12, RJ45 13–16), and `USW Pro Aggregation` is recognised as 32 optical ports (28 × 10G SFP+ plus 4 × 25G SFP28). XG16 and Pro Aggregation remain dashboard-disabled until verified faceplates exist rather than falling back to inaccurate generic geometry.

          The release also preserves maximum capability separately from negotiated speed, adds Nick's independent evidence to existing UniFi models without over-promoting them, and restores the newer validated Zyxel XS1930-10 contributor evidence into the authoritative Core registry before Discovery synchronization. Existing UniFi models without explicit API maps keep their previous sequential mapping behaviour.
          '''
          notes = '\n'.join(line[10:] if line.startswith('          ') else line for line in notes.splitlines()) + '\n'
          Path('RELEASE_NOTES.md').write_text(notes, encoding='utf-8', newline='\n')
          PY

          # The one-shot workflow is never part of the release commit/source.
          rm -f .github/workflows/prepare-core-v249-review.yml

      - name: Build and validate Core 2.4.9
        shell: bash
        run: |
          set -euo pipefail
          python build.py -v 2.4.9

          node --check src/js/switch-vision.js
          node --check src/custom_components/switch_vision/switch-vision-card.js
          node --check src/custom_components/switch_vision/switch-vision-panel.js
          node --check src/custom_components/switch_vision/switch-vision-dashboard-strategy.js

          for test in tests/test_*.py; do
            echo "::group::$test"
            PYTHONDONTWRITEBYTECODE=1 python "$test"
            echo "::endgroup::"
          done

          PYTHONDONTWRITEBYTECODE=1 python tools/check_core_release_parity.py

          # Build-only publication artifacts are recreated by the guarded
          # publish workflow from the exact merged commit; do not track them.
          rm -f \
            Releases/switch-vision-2.4.9.zip \
            Releases/switch-vision-2.4.9.zip.sha256 \
            Switch_Vision_v2.4.9_source.zip \
            Switch_Vision_v2.4.9_SHA256SUMS.txt
          find src tests tools -type d -name '__pycache__' -prune -exec rm -rf {} +
          find src tests tools -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete

          test "$(cat VERSION)" = "2.4.9"
          test -d Releases/switch-vision-2.4.9
          git diff --quiet origin/main -- Releases/switch-vision-2.4.8
          git diff --check

      - name: Commit tested Core 2.4.9 review source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'switch-vision-release-bot'
          git config user.email 'switch-vision@users.noreply.github.com'
          git add -A
          git commit -m 'Prepare Switch Vision Core v2.4.9 public release'
          git push origin HEAD:review/sv-2026-000002-unifi-mapping
