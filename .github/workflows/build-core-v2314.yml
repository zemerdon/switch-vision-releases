name: Build Core v2.3.14

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    if: ${{ github.event.head_commit.message == '[SV MAINT] build Core v2.3.14' }}
    name: Build Core v2.3.14 Test Mode offset
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install build dependency
        run: python3 -m pip install --disable-pip-version-check PyYAML

      - name: Patch, build, validate and push v2.3.14
        shell: bash
        run: |
          set -euo pipefail
          BRANCH='feature/core-2.3.14-test-mode-offset'
          VERSION='2.3.14'

          git config user.name 'Switch Vision CI'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin "$BRANCH"
          git switch -C "$BRANCH" "origin/$BRANCH"

          python3 <<'PY'
          from pathlib import Path
          import json

          js_path = Path('src/js/switch-vision.js')
          text = js_path.read_text(encoding='utf-8')

          old_default = 'calibration_button: { show: true, x: 1888, y: 372, width: 138, height: 34, anchor: "top_right" },'
          new_default = 'calibration_button: { show: true, x: 1888, y: 14, width: 138, height: 34, anchor: "top_right" },'
          if text.count(old_default) != 1:
              raise SystemExit('STOP: expected one v2.3.13 stock Calibrate default')
          text = text.replace(old_default, new_default, 1)

          old_migration = '''  if (
    Number(calibrationButtonUi.x) === 1888
    && Number(calibrationButtonUi.y) === 14
    && Number(calibrationButtonUi.width) === 138
    && Number(calibrationButtonUi.height) === 34
  ) {
    calibrationButtonUi.y = 372;
  }'''
          new_migration = '''  if (
    Number(calibrationButtonUi.x) === 1888
    && Number(calibrationButtonUi.y) === 372
    && Number(calibrationButtonUi.width) === 138
    && Number(calibrationButtonUi.height) === 34
  ) {
    calibrationButtonUi.y = 14;
  }'''
          if text.count(old_migration) != 1:
              raise SystemExit('STOP: expected one v2.3.13 Calibrate migration block')
          text = text.replace(old_migration, new_migration, 1)

          old_test_position = '''const testModeBelow = y + height + 4;
const testModeTop = (testModeBelow + height <= designHeight - 4)
  ? testModeBelow
  : Math.max(4, y - height - 4);'''
          new_test_position = 'const testModeTop = Math.min(designHeight - height - 4, y + height + 10);'
          if text.count(old_test_position) != 1:
              raise SystemExit('STOP: expected one v2.3.13 TEST MODE positioning block')
          text = text.replace(old_test_position, new_test_position, 1)
          js_path.write_text(text, encoding='utf-8')

          restored = []
          for path in sorted(Path('src/calibration').glob('*.json')):
              data = json.loads(path.read_text(encoding='utf-8'))
              ui = data.get('ui') if isinstance(data, dict) else None
              button = ui.get('calibration_button') if isinstance(ui, dict) else None
              if not isinstance(button, dict):
                  continue
              if (
                  float(button.get('x', -1)) == 1888
                  and float(button.get('y', -1)) == 372
                  and float(button.get('width', -1)) == 138
                  and float(button.get('height', -1)) == 34
              ):
                  button['y'] = 14
                  path.write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')
                  restored.append(str(path))
          if not restored:
              raise SystemExit('STOP: no v2.3.13 stock Calibrate placements were restored')
          print('Restored stock Calibrate placement:', ', '.join(restored))

          notes = [
              '# Switch Vision Core v2.3.14 — Test Mode control spacing',
              '',
              'Switch Vision Core v2.3.14 simplifies the Calibration LED Test Mode control placement.',
              '',
              '## Placement correction',
              '',
              '- Restores the normal Calibrate button to its original stock top-right position.',
              '- Places TEST MODE directly beneath Calibrate with a 10 px gap.',
              '- Keeps TEST MODE the same width and height as Calibrate.',
              '- Keeps the two controls aligned.',
              '- Corrects stock profiles moved by v2.3.13 while preserving genuinely customised Calibrate positions.',
              '',
              '## Behaviour unchanged',
              '',
              '- Done saves/closes Calibration while Test Mode remains active.',
              '- Reopening Calibration preserves Test Mode.',
              '- Cancel closes Calibration and turns Test Mode off.',
              '- Forced Status, RJ45 and SFP/uplink LED states are unchanged.',
              '',
              'No Discovery, port mapping, telemetry, faceplate assignment, calibration geometry or Activity LED tuning behaviour is changed.',
              '',
              'After updating Core through Switch Vision Installer, restart Home Assistant Core when prompted.',
              '',
          ]
          Path('RELEASE_NOTES.md').write_text('\n'.join(notes), encoding='utf-8')

          changelog_path = Path('CHANGELOG.md')
          changelog = changelog_path.read_text(encoding='utf-8')
          heading = '## v2.3.14 — Test Mode control spacing'
          if heading not in changelog:
              marker = '# Changelog\n\n'
              if not changelog.startswith(marker):
                  raise SystemExit('STOP: unexpected CHANGELOG.md header')
              entry = [
                  heading,
                  '',
                  '- Restores the stock Calibrate button to its original top-right position.',
                  '- Places TEST MODE 10 px below Calibrate with the same width, height and alignment.',
                  '- Corrects exact v2.3.13 stock button positions while preserving customised Calibrate placements.',
                  '- Keeps all v2.3.12 Test Mode persistence behaviour unchanged.',
                  '- Changes the Home Assistant custom integration/card files; restart Home Assistant Core after updating.',
                  '',
                  '',
              ]
              changelog_path.write_text(marker + '\n'.join(entry) + changelog[len(marker):], encoding='utf-8')
          PY

          node --check src/js/switch-vision.js
          git diff --check
          python3 build.py -v "$VERSION"

          rm -f \
            "Releases/switch-vision-$VERSION.zip" \
            "Releases/switch-vision-$VERSION.zip.sha256" \
            "Switch_Vision_v${VERSION}_source.zip" \
            "Switch_Vision_v${VERSION}_SHA256SUMS.txt"

          test "$(cat VERSION)" = "$VERSION"
          test -d "Releases/switch-vision-$VERSION"
          node --check src/js/switch-vision.js
          python3 tools/check_core_release_parity.py
          git diff --check

          if find src "Releases/switch-vision-$VERSION" \
            \( -type d -name '__pycache__' -o -type f -name '*.pyc' -o -type f -name '*.pyo' -o -type f -name '.DS_Store' \) \
            | grep -q .; then
            echo 'STOP: generated cache/junk material found after build'
            exit 1
          fi

          git add -A
          if git diff --cached --name-only | grep -E '\.(zip|pyc|pyo)$|SHA256SUMS|\.zip\.sha256$'; then
            echo 'STOP: archive/checksum/cache output was staged'
            exit 1
          fi
          git diff --cached --check
          git commit -m 'Build Switch Vision Core v2.3.14'
          git push origin "HEAD:$BRANCH"
