name: Build Core v2.3.15

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    if: ${{ github.event.head_commit.message == '[SV MAINT] build Core v2.3.15' }}
    name: Build Core v2.3.15 Test Mode screen spacing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install build dependency
        run: python3 -m pip install --disable-pip-version-check PyYAML

      - name: Patch, build, validate and push v2.3.15
        shell: bash
        run: |
          set -euo pipefail
          BRANCH='feature/core-2.3.15-test-mode-screen-gap'
          VERSION='2.3.15'

          git config user.name 'Switch Vision CI'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin "$BRANCH"
          git switch -C "$BRANCH" "origin/$BRANCH"

          python3 <<'PY'
          from pathlib import Path

          js_path = Path('src/js/switch-vision.js')
          text = js_path.read_text(encoding='utf-8')

          old = '''const testModeTop = Math.min(designHeight - height - 4, y + height + 10);
const testModeStyle = [
  `left:${(x / designWidth) * 100}%`,
  `top:${(testModeTop / designHeight) * 100}%`,'''
          new = '''const testModeStyle = [
  `left:${(x / designWidth) * 100}%`,
  `top:calc(${((y + height) / designHeight) * 100}% + 10px)`,'''
          if text.count(old) != 1:
              raise SystemExit('STOP: expected one v2.3.14 TEST MODE spacing block')
          text = text.replace(old, new, 1)
          js_path.write_text(text, encoding='utf-8')

          notes = [
              '# Switch Vision Core v2.3.15 — Consistent Test Mode spacing',
              '',
              '- Keeps Calibrate in its existing position.',
              '- Keeps TEST MODE directly beneath Calibrate at the same size and alignment.',
              '- Uses a real 10 CSS px gap so shallow and tall faceplates render the same visible spacing.',
              '- Keeps all Test Mode persistence behaviour unchanged.',
              '',
              'After updating Core through Switch Vision Installer, restart Home Assistant Core when prompted.',
              '',
          ]
          Path('RELEASE_NOTES.md').write_text('\n'.join(notes), encoding='utf-8')

          changelog_path = Path('CHANGELOG.md')
          changelog = changelog_path.read_text(encoding='utf-8')
          heading = '## v2.3.15 — Consistent Test Mode spacing'
          if heading not in changelog:
              marker = '# Changelog\n\n'
              if not changelog.startswith(marker):
                  raise SystemExit('STOP: unexpected CHANGELOG.md header')
              entry = [
                  heading,
                  '',
                  '- Uses a real 10 CSS px gap between Calibrate and TEST MODE so shallow faceplates do not compress the spacing.',
                  '- Keeps Calibrate and TEST MODE positions, size, alignment and behaviour otherwise unchanged.',
                  '- Changes the Home Assistant custom integration/card files; restart Home Assistant Core after updating.',
                  '',
                  '',
              ]
              changelog_path.write_text(marker + '\n'.join(entry) + changelog[len(marker):], encoding='utf-8')
          PY

          node --check src/js/switch-vision.js
          git diff --check
          python3 build.py -v "$VERSION"

          rm -f \
            "Releases/switch-vision-$VERSION.zip" \
            "Releases/switch-vision-$VERSION.zip.sha256" \
            "Switch_Vision_v${VERSION}_source.zip" \
            "Switch_Vision_v${VERSION}_SHA256SUMS.txt"

          test "$(cat VERSION)" = "$VERSION"
          test -d "Releases/switch-vision-$VERSION"
          node --check src/js/switch-vision.js
          python3 tools/check_core_release_parity.py
          git diff --check

          git add -A
          git diff --cached --check
          git commit -m 'Build Switch Vision Core v2.3.15'
          git push origin "HEAD:$BRANCH"

# retry after branch creation
