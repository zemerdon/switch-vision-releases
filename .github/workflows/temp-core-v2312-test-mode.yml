name: One-shot Core v2.3.12 Test Mode Patch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: Apply asserted Test Mode patch to isolated feature branch
        shell: bash
        run: |
          set -euo pipefail
          BRANCH='feature/core-2.3.12-test-mode-persistence'
          git fetch origin "$BRANCH"
          git switch -C "$BRANCH" "origin/$BRANCH"

          git config user.name 'Switch Vision CI'
          git config user.email 'actions@users.noreply.github.com'
          printf 'started\n' > .svdev-test-mode-workflow-started
          git add .svdev-test-mode-workflow-started
          git commit -m 'Mark Test Mode maintenance workflow start'
          git push origin "HEAD:$BRANCH"

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path('src/js/switch-vision.js')
          text = path.read_text(encoding='utf-8')

          def exact(old, new, expected, label):
              global text
              count = text.count(old)
              print(f'{label}: {count}/{expected}')
              if count != expected:
                  raise SystemExit(f'STOP: {label}: expected {expected}, found {count}')
              text = text.replace(old, new)

          def regex(pattern, repl, expected, label, flags=0):
              global text
              text, count = re.subn(pattern, repl, text, flags=flags)
              print(f'{label}: {count}/{expected}')
              if count != expected:
                  raise SystemExit(f'STOP: {label}: expected {expected}, found {count}')

          exact(
              '''function calibrationTestModeEnabled(config) {
  return calibrationControlsEnabled(config)
    && config?.calibration_test_mode === true;
}''',
              '''function calibrationTestModeEnabled(config) {
  return config?.calibration_test_mode === true;
}''',
              2,
              'independent Test Mode state',
          )

          regex(
              r'(calibration_mode: !active,\n\s+calibration_controls: !active,\n\s+)calibration_test_mode: false,',
              r'\1calibration_test_mode: this.config?.calibration_test_mode === true,',
              2,
              'Done/re-entry preserves Test Mode',
          )

          exact(
              '''    if (!calibrationEnabled(this.config)) {
      return "";
    }''',
              '''    if (!calibrationEnabled(this.config) && !calibrationTestModeEnabled(this.config)) {
      return "";
    }''',
              2,
              'keep Calibrate button available during Test Mode',
          )

          sticky = re.compile(
              r'\n\s*<button\n\s*type="button"\n\s*class="\$\{calibrationTestMode \? "cv-cal-warning" : "cv-cal-secondary"\}"\n\s*data-cv-action="toggle-led-test-mode"\n\s*title="Force all calibration LEDs solid ON"\n\s*>\$\{calibrationTestMode \? "Test Mode: ON" : "Test Mode"\}</button>'
          )
          text, count = sticky.subn('', text)
          print(f'remove sticky Test Mode control: {count}/2')
          if count != 2:
              raise SystemExit(f'STOP: sticky Test Mode controls: expected 2, found {count}')

          profile = '''          <span class="cv-cal-current">${htmlEscape(profileName)} · ${htmlEscape(profileLoadedText)}</span>
          <button type="button" data-cv-action="download-profile">Export Faceplate Profile</button>'''
          profile_with_test = '''          <span class="cv-cal-current">${htmlEscape(profileName)} · ${htmlEscape(profileLoadedText)}</span>
          <button
            type="button"
            class="${calibrationTestMode ? "cv-cal-warning" : "cv-cal-secondary"}"
            data-cv-action="toggle-led-test-mode"
            title="Force all calibration LEDs solid ON"
          >${calibrationTestMode ? "Test Mode: ON" : "Test Mode"}</button>
          <button type="button" data-cv-action="download-profile">Export Faceplate Profile</button>'''
          exact(profile, profile_with_test, 2, 'move Test Mode into Profile & Advanced Actions')

          button_return = '''    return `<button type="button" class="cv-cal-toggle ${active ? "is-active" : ""}" style="${style}" data-cv-action="toggle-calibration" title="${title}" ${opening ? "disabled" : ""}>${label}</button>`;'''
          button_with_indicator = '''    const testMode = calibrationTestModeEnabled(this.config);
    const testIndicatorTop = Math.min(designHeight - 16, y + height + 4);
    const testIndicatorStyle = [
      `left:${((x + (width / 2)) / designWidth) * 100}%`,
      `top:${(testIndicatorTop / designHeight) * 100}%`,
      "position:absolute",
      "right:auto",
      "transform:translateX(-50%)",
      "z-index:16",
      "pointer-events:none",
      "white-space:nowrap",
      "font-size:9px",
      "font-weight:800",
      "letter-spacing:.12em",
      "line-height:1",
      "color:#ffd54a",
      "background:rgba(4,12,18,.82)",
      "border:1px solid rgba(255,213,74,.55)",
      "border-radius:3px",
      "padding:2px 5px",
      "box-shadow:0 1px 2px rgba(0,0,0,.65)"
    ].join(";");
    const testIndicator = testMode && !active
      ? `<div class="cv-cal-test-indicator" style="${testIndicatorStyle}" title="Calibration LED Test Mode is still active">TEST MODE</div>`
      : "";
    return `<button type="button" class="cv-cal-toggle ${active ? "is-active" : ""}" style="${style}" data-cv-action="toggle-calibration" title="${title}" ${opening ? "disabled" : ""}>${label}</button>${testIndicator}`;'''
          exact(button_return, button_with_indicator, 2, 'TEST MODE badge beneath Calibrate')

          action_count = text.count('data-cv-action="toggle-led-test-mode"')
          reset_count = text.count('calibration_test_mode: false')
          indicator_count = text.count('class="cv-cal-test-indicator"')
          print(f'final Test Mode actions: {action_count}')
          print(f'final explicit Test Mode resets: {reset_count}')
          print(f'final TEST MODE indicators: {indicator_count}')
          if action_count != 2:
              raise SystemExit('STOP: expected one Test Mode action in each renderer')
          if reset_count != 4:
              raise SystemExit('STOP: expected only defaults and Cancel to reset Test Mode')
          if indicator_count != 2:
              raise SystemExit('STOP: expected TEST MODE badge in both renderers')

          path.write_text(text, encoding='utf-8')
          PY

          node --check src/js/switch-vision.js
          git diff --check
          git diff -- src/js/switch-vision.js

          git rm .svdev-test-mode-workflow-started
          git add src/js/switch-vision.js
          git diff --cached --check
          git commit -m 'Keep calibration Test Mode active after Done'
          git push origin "HEAD:$BRANCH"
