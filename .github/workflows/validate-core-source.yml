name: Validate Core Source

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Core source/release parity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Validate Core source/release parity
        run: python3 tools/check_core_release_parity.py

      - name: Validate version contract
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(cat VERSION)"

          python3 - "$VERSION" <<'PY'
          import json
          import sys
          from pathlib import Path

          version = sys.argv[1]
          root = Path(".")

          component = json.loads(
              (
                  root
                  / "src"
                  / "custom_components"
                  / "switch_vision"
                  / "manifest.json"
              ).read_text(encoding="utf-8")
          )

          release_component = json.loads(
              (
                  root
                  / "Releases"
                  / f"switch-vision-{version}"
                  / "custom_components"
                  / "switch_vision"
                  / "manifest.json"
              ).read_text(encoding="utf-8")
          )

          release = json.loads(
              (
                  root
                  / "Releases"
                  / f"switch-vision-{version}"
                  / "manifest.json"
              ).read_text(encoding="utf-8")
          )

          assert component["version"] == version
          assert release_component["version"] == version
          assert release["version"] == version

          print(f"Core {version} version contract: PASS")
          PY

      - name: Reject generated cache material
        shell: bash
        run: |
          set -euo pipefail

          if find src Releases \
            \( \
              -type d -name '__pycache__' \
              -o -type f -name '*.pyc' \
              -o -type f -name '*.pyo' \
              -o -type f -name '.DS_Store' \
            \) | grep -q .; then
              echo "ERROR: generated cache/junk material found."
              exit 1
          fi

          echo "Core source hygiene: PASS"

      - name: Compile Python entry points
        run: |
          python3 -m py_compile \
            src/custom_components/switch_vision/__init__.py \
            src/custom_components/switch_vision/config_flow.py \
            src/devices/generate_supported_devices.py

  build_v2312:
    if: ${{ github.event_name == 'push' && github.event.head_commit.message == '[SV MAINT] build Core v2.3.12' }}
    name: Build Core v2.3.12 feature branch
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install build dependency
        run: python3 -m pip install --disable-pip-version-check PyYAML

      - name: Build and push isolated v2.3.12 branch
        shell: bash
        run: |
          set -euo pipefail
          BRANCH='feature/core-2.3.12-test-mode-persistence'
          VERSION='2.3.12'
          BUILD_LOG='/tmp/sv-core-v2312-build.log'

          git config user.name 'Switch Vision CI'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin "$BRANCH"
          git switch -C "$BRANCH" "origin/$BRANCH"

          report_failure() {
            rc="$1"
            line="$2"
            cmd="$3"
            trap - ERR
            set +e
            tmp_diag='/tmp/sv-core-v2312-build-diagnostic.txt'
            {
              echo 'Switch Vision Core v2.3.12 guarded build diagnostic'
              echo "exit_code=$rc"
              echo "line=$line"
              echo "command=$cmd"
              echo
              echo '===== BUILD LOG TAIL ====='
              if [ -f "$BUILD_LOG" ]; then
                tail -n 250 "$BUILD_LOG"
              else
                echo 'No build log was produced before the failure.'
              fi
            } > "$tmp_diag"
            git reset --hard "origin/$BRANCH"
            git clean -fd
            cp "$tmp_diag" .sv-core-v2312-build-diagnostic.txt
            git add .sv-core-v2312-build-diagnostic.txt
            git commit -m 'Record Core v2.3.12 build diagnostic' || true
            git push origin "HEAD:$BRANCH" || true
            exit "$rc"
          }
          trap 'report_failure "$?" "$LINENO" "$BASH_COMMAND"' ERR

          python3 <<'PY'
          from pathlib import Path

          path = Path('CHANGELOG.md')
          text = path.read_text(encoding='utf-8')
          heading = '## v2.3.12 — Persistent Calibration LED Test Mode'
          if heading not in text:
              marker = '# Changelog\n\n'
              if not text.startswith(marker):
                  raise SystemExit('STOP: unexpected CHANGELOG.md header')
              entry = '''## v2.3.12 — Persistent Calibration LED Test Mode

- Keeps Calibration LED Test Mode active after **Done** closes and saves the calibration editor.
- Decouples Test Mode from the open calibration-controls state so forced Status, RJ45, and SFP/uplink LEDs remain visible for clean faceplate inspection.
- Adds a small **TEST MODE** indicator directly beneath the normal Calibrate button while Test Mode remains active.
- Preserves Test Mode when Calibration is reopened.
- Keeps **Cancel** as the explicit path that closes Calibration and turns Test Mode off.
- Does not change saved calibration geometry, faceplate assignments, Discovery, physical-port mappings, live telemetry, or Activity LED tuning.
- Changes the Home Assistant custom integration/card files; restart Home Assistant Core after updating.


'''
              path.write_text(marker + entry + text[len(marker):], encoding='utf-8')
          PY

          python3 build.py -v "$VERSION" 2>&1 | tee "$BUILD_LOG"

          rm -f \
            "Releases/switch-vision-$VERSION.zip" \
            "Releases/switch-vision-$VERSION.zip.sha256" \
            "Switch_Vision_v${VERSION}_source.zip" \
            "Switch_Vision_v${VERSION}_SHA256SUMS.txt"

          if find src "Releases/switch-vision-$VERSION" \
            \( -type d -name '__pycache__' -o -type f -name '*.pyc' -o -type f -name '*.pyo' -o -type f -name '.DS_Store' \) \
            | grep -q .; then
            echo 'STOP: generated cache/junk material found after build'
            false
          fi

          test "$(cat VERSION)" = "$VERSION"
          test -d "Releases/switch-vision-$VERSION"
          test ! -e "Releases/switch-vision-$VERSION.zip"
          test ! -e "Releases/switch-vision-$VERSION.zip.sha256"
          test ! -e "Switch_Vision_v${VERSION}_source.zip"
          test ! -e "Switch_Vision_v${VERSION}_SHA256SUMS.txt"

          node --check src/js/switch-vision.js
          python3 tools/check_core_release_parity.py
          git diff --check

          echo '===== BUILD CHANGE SUMMARY ====='
          git status --short
          git diff --stat

          git add -A

          if git diff --cached --name-only | grep -E '\.(zip|pyc|pyo)$|SHA256SUMS|\.zip\.sha256$'; then
            echo 'STOP: archive/checksum/cache output was staged'
            false
          fi

          git diff --cached --check
          rm -f .sv-core-v2312-build-diagnostic.txt
          git add -A
          git commit -m 'Build Switch Vision Core v2.3.12'
          git push origin "HEAD:$BRANCH"
