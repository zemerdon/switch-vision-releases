name: Validate Core Source

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Core source/release parity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install build dependency
        run: python3 -m pip install --disable-pip-version-check PyYAML

      - name: Validate JavaScript syntax
        run: |
          node --check src/js/switch-vision.js
          node --check src/custom_components/switch_vision/switch-vision-card.js
          node --check src/custom_components/switch_vision/switch-vision-panel.js
          node --check src/custom_components/switch_vision/switch-vision-dashboard-strategy.js

      - name: Validate Core source/release parity
        run: python3 tools/check_core_release_parity.py

      - name: Validate version and HAOS resource contract
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(cat VERSION)"

          python3 - "$VERSION" <<'PY'
          import json
          import sys
          from pathlib import Path

          version = sys.argv[1]
          root = Path(".")
          expected_resource = f"/local/switch-vision/js/switch-vision.js?v={version}"

          component = json.loads(
              (
                  root
                  / "src"
                  / "custom_components"
                  / "switch_vision"
                  / "manifest.json"
              ).read_text(encoding="utf-8")
          )
          source_manifest = json.loads(
              (root / "src" / "manifest.json").read_text(encoding="utf-8")
          )
          release_component = json.loads(
              (
                  root
                  / "Releases"
                  / f"switch-vision-{version}"
                  / "custom_components"
                  / "switch_vision"
                  / "manifest.json"
              ).read_text(encoding="utf-8")
          )
          release = json.loads(
              (
                  root
                  / "Releases"
                  / f"switch-vision-{version}"
                  / "manifest.json"
              ).read_text(encoding="utf-8")
          )

          assert component["version"] == version
          assert source_manifest["version"] == version
          assert source_manifest["resource"] == expected_resource
          assert release_component["version"] == version
          assert release["version"] == version
          assert release["resource"] == expected_resource

          print(
              f"Core {version} version/resource contract: PASS "
              f"({expected_resource})"
          )
          PY

      - name: Reject generated cache material
        shell: bash
        run: |
          set -euo pipefail

          if find src Releases tests \
            \( \
              -type d -name '__pycache__' \
              -o -type f -name '*.pyc' \
              -o -type f -name '*.pyo' \
              -o -type f -name '.DS_Store' \
            \) | grep -q .; then
              echo "ERROR: generated cache/junk material found."
              exit 1
          fi

          echo "Core source hygiene: PASS"

      - name: Compile Python entry points and regressions
        run: |
          python3 -m py_compile \
            src/custom_components/switch_vision/__init__.py \
            src/custom_components/switch_vision/config_flow.py \
            src/devices/generate_supported_devices.py \
            tests/*.py

      - name: Run permanent Core regression suite
        shell: bash
        run: |
          set -euo pipefail
          for test in tests/test_*.py; do
            echo "::group::$test"
            python3 "$test"
            echo "::endgroup::"
          done

      - name: Remove validation bytecode
        shell: bash
        run: |
          set -euo pipefail
          find src tests -type d -name '__pycache__' -prune -exec rm -rf {} +
          find src tests -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete

      - name: Rebuild current release deterministically
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(cat VERSION)"

          python3 build.py -v "$VERSION"

          rm -f \
            "Releases/switch-vision-$VERSION.zip" \
            "Releases/switch-vision-$VERSION.zip.sha256" \
            "Switch_Vision_v${VERSION}_source.zip" \
            "Switch_Vision_v${VERSION}_SHA256SUMS.txt"

          git diff --exit-code

          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo "ERROR: deterministic rebuild left unexpected untracked files:"
            git status --short --untracked-files=all
            exit 1
          fi

          echo "Core deterministic rebuild: PASS"
