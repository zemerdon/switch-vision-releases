name: Validate Core Source

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  remediate:
    if: github.event.head_commit.message == 'Run privacy remediation build'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python3 -m pip install --disable-pip-version-check PyYAML

      - name: Sanitize public attribution and build Core 2.4.11
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/sanitize_public_attribution.py --core-version 2.4.11
          python3 build.py -v 2.4.11
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 tools/check_core_release_parity.py
          node --check src/js/switch-vision.js
          node --check src/custom_components/switch_vision/switch-vision-card.js
          git diff --check

      - name: Restore normal workflow and remove temporary remediation files
        shell: bash
        run: |
          set -euo pipefail
          git show HEAD^^:.github/workflows/validate-core-source.yml > .github/workflows/validate-core-source.yml
          rm -f .github/workflows/prepare-public-attribution-policy.yml .privacy-remediation-trigger

      - name: Commit validated privacy remediation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'switch-vision-release-bot'
          git config user.email 'switch-vision@users.noreply.github.com'
          git add -A
          git commit -m 'Core v2.4.11: enforce public attribution privacy policy'
          git push origin HEAD:main
