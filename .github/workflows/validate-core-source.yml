name: Validate Core Source

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    name: Core source/release parity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: review/sv-2026-000002-unifi-mapping
          fetch-depth: 0
          persist-credentials: true

      - name: Export review source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sv-core-review-source
          path: |
            build.py
            src/js/switch-vision.js
            src/custom_components/switch_vision/__init__.py
            src/custom_components/switch_vision/switch-vision-card.js
            src/devices
            tests

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install build dependency
        run: python3 -m pip install --disable-pip-version-check PyYAML ruamel.yaml

      - name: Apply SV-2026-000002 review patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("tools/apply_sv_2026_000002_review.py").resolve()
          source = path.read_text(encoding="utf-8")
          marker = "# Registry updates use round-trip YAML"
          if marker not in source:
              raise SystemExit("temporary patch helper registry boundary missing")
          prefix = source.split(marker, 1)[0]
          namespace = {"__file__": str(path), "__name__": "__main__"}
          exec(compile(prefix, str(path), "exec"), namespace)
          PY
          python3 tools/apply_sv_2026_000002_registry_review.py

      - name: Rebuild patched review tree
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(cat VERSION)"
          python3 build.py -v "$VERSION"
          rm -f \
            "Releases/switch-vision-$VERSION.zip" \
            "Releases/switch-vision-$VERSION.zip.sha256" \
            "Switch_Vision_v${VERSION}_source.zip" \
            "Switch_Vision_v${VERSION}_SHA256SUMS.txt"
          git diff --check

      - name: Commit patched review tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "switch-vision-review-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Implement SV-2026-000002 UniFi mapping contracts"
            git push origin HEAD:review/sv-2026-000002-unifi-mapping
          else
            echo "Review tree already contains the SV-2026-000002 implementation."
          fi

      - name: Validate JavaScript syntax
        run: |
          node --check src/js/switch-vision.js
          node --check src/custom_components/switch_vision/switch-vision-card.js
          node --check src/custom_components/switch_vision/switch-vision-panel.js
          node --check src/custom_components/switch_vision/switch-vision-dashboard-strategy.js

      - name: Validate Core source/release parity
        run: python3 tools/check_core_release_parity.py

      - name: Validate version and HAOS resource contract
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(cat VERSION)"

          python3 - "$VERSION" <<'PY'
          import json
          import sys
          from pathlib import Path

          version = sys.argv[1]
          root = Path(".")
          expected_resource = f"/local/switch-vision/js/switch-vision.js?v={version}"

          component = json.loads(
              (
                  root
                  / "src"
                  / "custom_components"
                  / "switch_vision"
                  / "manifest.json"
              ).read_text(encoding="utf-8")
          )
          source_manifest = json.loads(
              (root / "src" / "manifest.json").read_text(encoding="utf-8")
          )
          release_component = json.loads(
              (
                  root
                  / "Releases"
                  / f"switch-vision-{version}"
                  / "custom_components"
                  / "switch_vision"
                  / "manifest.json"
              ).read_text(encoding="utf-8")
          )
          release = json.loads(
              (
                  root
                  / "Releases"
                  / f"switch-vision-{version}"
                  / "manifest.json"
              ).read_text(encoding="utf-8")
          )

          assert component["version"] == version
          assert source_manifest["version"] == version
          assert source_manifest["resource"] == expected_resource
          assert release_component["version"] == version
          assert release["version"] == version
          assert release["resource"] == expected_resource

          print(
              f"Core {version} version/resource contract: PASS "
              f"({expected_resource})"
          )
          PY

      - name: Reject generated cache material
        shell: bash
        run: |
          set -euo pipefail

          if find src Releases tests \
            \( \
              -type d -name '__pycache__' \
              -o -type f -name '*.pyc' \
              -o -type f -name '*.pyo' \
              -o -type f -name '.DS_Store' \
            \) | grep -q .; then
              echo "ERROR: generated cache/junk material found."
              exit 1
          fi

          echo "Core source hygiene: PASS"

      - name: Compile Python entry points and regressions
        run: |
          python3 -m py_compile \
            src/custom_components/switch_vision/__init__.py \
            src/custom_components/switch_vision/config_flow.py \
            src/devices/generate_supported_devices.py \
            tests/*.py

      - name: Run permanent Core regression suite
        shell: bash
        run: |
          set -euo pipefail
          for test in tests/test_*.py; do
            echo "::group::$test"
            python3 "$test"
            echo "::endgroup::"
          done

      - name: Remove validation bytecode
        shell: bash
        run: |
          set -euo pipefail
          find src tests -type d -name '__pycache__' -prune -exec rm -rf {} +
          find src tests -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete

      - name: Rebuild current release deterministically
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(cat VERSION)"

          python3 build.py -v "$VERSION"

          rm -f \
            "Releases/switch-vision-$VERSION.zip" \
            "Releases/switch-vision-$VERSION.zip.sha256" \
            "Switch_Vision_v${VERSION}_source.zip" \
            "Switch_Vision_v${VERSION}_SHA256SUMS.txt"

          git diff --exit-code

          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo "ERROR: deterministic rebuild left unexpected untracked files:"
            git status --short --untracked-files=all
            exit 1
          fi

          echo "Core deterministic rebuild: PASS"
