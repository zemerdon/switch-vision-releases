name: Validate Core Source

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    name: Core source/release parity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: Bootstrap calibration Test Mode relocation
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/core-2.3.12-calibration-test-mode'
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin feature/core-2.3.12-calibration-test-mode
          git switch -C feature/core-2.3.12-calibration-test-mode origin/feature/core-2.3.12-calibration-test-mode

          python3 <<'PY'
          from pathlib import Path

          path = Path("src/js/switch-vision.js")
          text = path.read_text(encoding="utf-8")

          sticky = '''          <button
            type="button"
            class="${calibrationTestMode ? "cv-cal-warning" : "cv-cal-secondary"}"
            data-cv-action="toggle-led-test-mode"
            title="Force all calibration LEDs solid ON"
          >${calibrationTestMode ? "Test Mode: ON" : "Test Mode"}</button>
'''

          profile = '''          <span class="cv-cal-current">${htmlEscape(profileName)} · ${htmlEscape(profileLoadedText)}</span>
          <button type="button" data-cv-action="download-profile">Export Faceplate Profile</button>'''

          replacement = '''          <span class="cv-cal-current">${htmlEscape(profileName)} · ${htmlEscape(profileLoadedText)}</span>
          <button
            type="button"
            class="${calibrationTestMode ? "cv-cal-warning" : "cv-cal-secondary"}"
            data-cv-action="toggle-led-test-mode"
            title="Force all calibration LEDs solid ON"
          >${calibrationTestMode ? "Test Mode: ON" : "Test Mode"}</button>
          <button type="button" data-cv-action="download-profile">Export Faceplate Profile</button>'''

          sticky_count = text.count(sticky)
          profile_count = text.count(profile)
          action_count = text.count('data-cv-action="toggle-led-test-mode"')

          print(f"sticky Test Mode blocks: {sticky_count}")
          print(f"Profile & Advanced Actions insertion points: {profile_count}")
          print(f"Test Mode actions: {action_count}")

          if sticky_count != 2:
              raise SystemExit(f"expected exactly 2 sticky Test Mode blocks, found {sticky_count}")
          if profile_count != 2:
              raise SystemExit(f"expected exactly 2 Profile & Advanced Actions insertion points, found {profile_count}")
          if action_count != 2:
              raise SystemExit(f"expected exactly 2 Test Mode actions, found {action_count}")

          text = text.replace(sticky, "")
          text = text.replace(profile, replacement)

          if text.count(sticky) != 0:
              raise SystemExit("old sticky Test Mode block remains")
          if text.count(replacement) != 2:
              raise SystemExit("Test Mode was not inserted into both Profile & Advanced Actions renderers")
          if text.count('data-cv-action="toggle-led-test-mode"') != 2:
              raise SystemExit("unexpected Test Mode action count after relocation")

          path.write_text(text, encoding="utf-8")
          print("Calibration Test Mode relocation: PASS")
          PY

          node --check src/js/switch-vision.js
          git diff --check

          echo "===== EXACT RELOCATION DIFF ====="
          git diff -- src/js/switch-vision.js

          git config user.name "Switch Vision CI"
          git config user.email "actions@users.noreply.github.com"
          git add src/js/switch-vision.js
          git diff --cached --check
          git commit -m "Move calibration Test Mode into advanced actions"
          git push origin HEAD:feature/core-2.3.12-calibration-test-mode

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Validate Core source/release parity
        run: python3 tools/check_core_release_parity.py

      - name: Validate version contract
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(cat VERSION)"

          python3 - "$VERSION" <<'PY'
          import json
          import sys
          from pathlib import Path

          version = sys.argv[1]
          root = Path(".")

          component = json.loads(
              (
                  root
                  / "src"
                  / "custom_components"
                  / "switch_vision"
                  / "manifest.json"
              ).read_text(encoding="utf-8")
          )

          release_component = json.loads(
              (
                  root
                  / "Releases"
                  / f"switch-vision-{version}"
                  / "custom_components"
                  / "switch_vision"
                  / "manifest.json"
              ).read_text(encoding="utf-8")
          )

          release = json.loads(
              (
                  root
                  / "Releases"
                  / f"switch-vision-{version}"
                  / "manifest.json"
              ).read_text(encoding="utf-8")
          )

          assert component["version"] == version
          assert release_component["version"] == version
          assert release["version"] == version

          print(f"Core {version} version contract: PASS")
          PY

      - name: Reject generated cache material
        shell: bash
        run: |
          set -euo pipefail

          if find src Releases \
            \( \
              -type d -name '__pycache__' \
              -o -type f -name '*.pyc' \
              -o -type f -name '*.pyo' \
              -o -type f -name '.DS_Store' \
            \) | grep -q .; then
              echo "ERROR: generated cache/junk material found."
              exit 1
          fi

          echo "Core source hygiene: PASS"

      - name: Compile Python entry points
        run: |
          python3 -m py_compile \
            src/custom_components/switch_vision/__init__.py \
            src/custom_components/switch_vision/config_flow.py \
            src/devices/generate_supported_devices.py
