name: Validate Core Source

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Core source/release parity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Validate Core source/release parity
        run: python3 tools/check_core_release_parity.py

      - name: Validate version contract
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(cat VERSION)"

          python3 - "$VERSION" <<'PY'
          import json
          import sys
          from pathlib import Path

          version = sys.argv[1]
          root = Path(".")

          component = json.loads(
              (
                  root
                  / "src"
                  / "custom_components"
                  / "switch_vision"
                  / "manifest.json"
              ).read_text(encoding="utf-8")
          )

          release_component = json.loads(
              (
                  root
                  / "Releases"
                  / f"switch-vision-{version}"
                  / "custom_components"
                  / "switch_vision"
                  / "manifest.json"
              ).read_text(encoding="utf-8")
          )

          release = json.loads(
              (
                  root
                  / "Releases"
                  / f"switch-vision-{version}"
                  / "manifest.json"
              ).read_text(encoding="utf-8")
          )

          assert component["version"] == version
          assert release_component["version"] == version
          assert release["version"] == version

          print(f"Core {version} version contract: PASS")
          PY

      - name: Reject generated cache material
        shell: bash
        run: |
          set -euo pipefail

          if find src Releases \
            \( \
              -type d -name '__pycache__' \
              -o -type f -name '*.pyc' \
              -o -type f -name '*.pyo' \
              -o -type f -name '.DS_Store' \
            \) | grep -q .; then
              echo "ERROR: generated cache/junk material found."
              exit 1
          fi

          echo "Core source hygiene: PASS"

      - name: Compile Python entry points
        run: |
          python3 -m py_compile \
            src/custom_components/switch_vision/__init__.py \
            src/custom_components/switch_vision/config_flow.py \
            src/devices/generate_supported_devices.py

  apply_test_mode_patch:
    if: ${{ github.event_name == 'push' && github.event.head_commit.message == '[SV MAINT] apply Core Test Mode patch' }}
    name: Apply verified Test Mode patch
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: Patch isolated feature branch
        shell: bash
        run: |
          set -euo pipefail
          BRANCH='feature/core-2.3.12-test-mode-persistence'

          git config user.name 'Switch Vision CI'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin "$BRANCH"
          git switch -C "$BRANCH" "origin/$BRANCH"

          python3 <<'PY'
          from pathlib import Path

          path = Path('src/js/switch-vision.js')
          text = path.read_text(encoding='utf-8')

          def replace_exact(old, new, expected, label):
              global text
              count = text.count(old)
              print(f'{label}: {count}/{expected}')
              if count != expected:
                  raise SystemExit(f'STOP: {label}: expected {expected}, found {count}')
              text = text.replace(old, new)

          replace_exact(
              '''function calibrationTestModeEnabled(config) {
            return calibrationControlsEnabled(config)
              && config?.calibration_test_mode === true;
          }''',
              '''function calibrationTestModeEnabled(config) {
            return config?.calibration_test_mode === true;
          }''',
              1,
              'decouple Test Mode from open calibration controls',
          )

          replace_exact(
              '''        calibration_mode: !active,
                  calibration_controls: !active,
                  calibration_test_mode: false,
                  calibration_target: this.config.calibration_target || "all",''',
              '''        calibration_mode: !active,
                  calibration_controls: !active,
                  calibration_test_mode: this.config?.calibration_test_mode === true,
                  calibration_target: this.config.calibration_target || "all",''',
              1,
              'preserve Test Mode when Done closes calibration',
          )

          old_return = '''    return `<button type="button" class="cv-cal-toggle ${active ? "is-active" : ""}" style="${style}" data-cv-action="toggle-calibration" title="${title}" ${opening ? "disabled" : ""}>${label}</button>`;'''
          new_return = '''    const testModeActive = calibrationTestModeEnabled(this.config);
              const testModeTop = Math.min(designHeight - 14, y + height + 4);
              const testModeStyle = [
                `left:${((x + (width / 2)) / designWidth) * 100}%`,
                `top:${(testModeTop / designHeight) * 100}%`,
                "position:absolute",
                "right:auto",
                "transform:translateX(-50%)",
                "z-index:16",
                "pointer-events:none",
                "white-space:nowrap",
                "font-size:9px",
                "font-weight:800",
                "letter-spacing:.12em",
                "line-height:1",
                "color:#ffd54a",
                "background:rgba(4,12,18,.82)",
                "border:1px solid rgba(255,213,74,.55)",
                "border-radius:3px",
                "padding:2px 5px",
                "box-shadow:0 1px 2px rgba(0,0,0,.65)"
              ].join(";");
              const testModeBadge = testModeActive
                ? `<div class="cv-cal-test-mode-badge" style="${testModeStyle}" title="Calibration LED Test Mode is active">TEST MODE</div>`
                : "";
              return `<button type="button" class="cv-cal-toggle ${active ? "is-active" : ""}" style="${style}" data-cv-action="toggle-calibration" title="${title}" ${opening ? "disabled" : ""}>${label}</button>${testModeBadge}`;'''
          replace_exact(old_return, new_return, 1, 'add TEST MODE badge under Calibration button')

          if text.count('calibration_test_mode: false') != 2:
              raise SystemExit('STOP: expected only default config and Cancel to reset Test Mode')
          if text.count('class="cv-cal-test-mode-badge"') != 1:
              raise SystemExit('STOP: expected exactly one TEST MODE badge renderer')
          if text.count('data-cv-action="toggle-led-test-mode"') != 1:
              raise SystemExit('STOP: expected existing Test Mode control exactly once')

          path.write_text(text, encoding='utf-8')
          print('Core Test Mode patch assertions: PASS')
          PY

          node --check src/js/switch-vision.js
          git diff --check
          git diff --stat

          git add src/js/switch-vision.js
          git diff --cached --check
          git commit -m 'Keep calibration Test Mode active after Done'
          git push origin "HEAD:$BRANCH"
