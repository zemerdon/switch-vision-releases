name: Validate Core Source

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    name: Core source/release parity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: Bootstrap Core v2.3.12 Test Mode behavior
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/core-2.3.12-test-mode-persistence'
        shell: bash
        run: |
          set -euo pipefail

          BRANCH="feature/core-2.3.12-test-mode-persistence"
          git fetch origin "$BRANCH"
          git switch -C "$BRANCH" "origin/$BRANCH"

          python3 <<'PY'
          from pathlib import Path

          path = Path("src/js/switch-vision.js")
          text = path.read_text(encoding="utf-8")

          def replace_exact(label, old, new, expected=2):
              global text
              count = text.count(old)
              print(f"{label}: found {count}, expected {expected}")
              if count != expected:
                  raise SystemExit(f"STOP: {label} count mismatch ({count} != {expected})")
              text = text.replace(old, new)

          # Test Mode must remain effective even after Calibration controls close.
          replace_exact(
              "calibrationTestModeEnabled helper",
              '''function calibrationTestModeEnabled(config) {
            return calibrationControlsEnabled(config)
              && config?.calibration_test_mode === true;
          }''',
              '''function calibrationTestModeEnabled(config) {
            return config?.calibration_test_mode === true;
          }'''
          )

          # Done preserves Test Mode; Cancel continues to clear it explicitly.
          replace_exact(
              "Done Test Mode preservation",
              '''        calibration_mode: !active,
                  calibration_controls: !active,
                  calibration_test_mode: false,
                  calibration_target: this.config.calibration_target || "all",''',
              '''        calibration_mode: !active,
                  calibration_controls: !active,
                  calibration_test_mode: this.config?.calibration_test_mode === true,
                  calibration_target: this.config.calibration_target || "all",'''
          )

          # Remove the Test Mode control from the sticky action strip.
          sticky = '''          <button
                    type="button"
                    class="${calibrationTestMode ? "cv-cal-warning" : "cv-cal-secondary"}"
                    data-cv-action="toggle-led-test-mode"
                    title="Force all calibration LEDs solid ON"
                  >${calibrationTestMode ? "Test Mode: ON" : "Test Mode"}</button>
          '''
          replace_exact("sticky Test Mode control", sticky, "")

          # Put the same control into Profile & Advanced Actions.
          profile_marker = '''          <span class="cv-cal-current">${htmlEscape(profileName)} · ${htmlEscape(profileLoadedText)}</span>
                  <button type="button" data-cv-action="download-profile">Export Faceplate Profile</button>'''
          profile_replacement = '''          <span class="cv-cal-current">${htmlEscape(profileName)} · ${htmlEscape(profileLoadedText)}</span>
                  <button
                    type="button"
                    class="${calibrationTestMode ? "cv-cal-warning" : "cv-cal-secondary"}"
                    data-cv-action="toggle-led-test-mode"
                    title="Force all calibration LEDs solid ON"
                  >${calibrationTestMode ? "Test Mode: ON" : "Test Mode"}</button>
                  <button type="button" data-cv-action="download-profile">Export Faceplate Profile</button>'''
          replace_exact("Profile & Advanced Actions insertion", profile_marker, profile_replacement)

          # When Calibration is closed but Test Mode remains active, show a small
          # badge directly beneath the on-faceplate Calibrate button.
          button_return = '''    return `<button type="button" class="cv-cal-toggle ${active ? "is-active" : ""}" style="${style}" data-cv-action="toggle-calibration" title="${title}" ${opening ? "disabled" : ""}>${label}</button>`;'''
          button_replacement = '''    const testMode = calibrationTestModeEnabled(this.config);
              const testIndicatorTop = Math.min(designHeight - 16, y + height + 4);
              const testIndicatorStyle = [
                `left:${((x + (width / 2)) / designWidth) * 100}%`,
                `top:${(testIndicatorTop / designHeight) * 100}%`,
                "position:absolute",
                "right:auto",
                "transform:translateX(-50%)",
                "z-index:16",
                "pointer-events:none",
                "white-space:nowrap",
                "font-size:9px",
                "font-weight:800",
                "letter-spacing:.12em",
                "line-height:1",
                "color:#ffd54a",
                "background:rgba(4,12,18,.82)",
                "border:1px solid rgba(255,213,74,.55)",
                "border-radius:3px",
                "padding:2px 5px",
                "box-shadow:0 1px 2px rgba(0,0,0,.65)"
              ].join(";");
              const testIndicator = testMode && !active
                ? `<div class="cv-cal-test-indicator" style="${testIndicatorStyle}" title="Calibration LED Test Mode is still active">TEST MODE</div>`
                : "";
              return `<button type="button" class="cv-cal-toggle ${active ? "is-active" : ""}" style="${style}" data-cv-action="toggle-calibration" title="${title}" ${opening ? "disabled" : ""}>${label}</button>${testIndicator}`;'''
          replace_exact("Calibrate TEST MODE indicator", button_return, button_replacement)

          # Safety checks: exactly one Test Mode action per duplicated renderer,
          # no Test Mode action remains in the sticky strip, Cancel still clears it.
          if text.count('data-cv-action="toggle-led-test-mode"') != 2:
              raise SystemExit("STOP: unexpected Test Mode action count after relocation")
          if text.count('calibration_test_mode: false') != 4:
              raise SystemExit("STOP: expected only defaults + Cancel to clear Test Mode")
          if text.count('class="cv-cal-test-indicator"') != 2:
              raise SystemExit("STOP: TEST MODE indicator was not added to both renderers")

          path.write_text(text, encoding="utf-8")
          print("Core v2.3.12 Test Mode behavior patch: PASS")
          PY

          node --check src/js/switch-vision.js
          git diff --check
          echo "===== TEST MODE DIFF ====="
          git diff -- src/js/switch-vision.js

          if git diff --quiet -- src/js/switch-vision.js; then
            echo "STOP: expected Test Mode source changes were not produced"
            exit 1
          fi

          git config user.name "Switch Vision CI"
          git config user.email "actions@users.noreply.github.com"
          git add src/js/switch-vision.js
          git diff --cached --check
          git commit -m "Keep calibration Test Mode active after Done"
          git push origin "HEAD:$BRANCH"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Validate Core source/release parity
        run: python3 tools/check_core_release_parity.py

      - name: Validate version contract
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(cat VERSION)"

          python3 - "$VERSION" <<'PY'
          import json
          import sys
          from pathlib import Path

          version = sys.argv[1]
          root = Path(".")

          component = json.loads(
              (
                  root
                  / "src"
                  / "custom_components"
                  / "switch_vision"
                  / "manifest.json"
              ).read_text(encoding="utf-8")
          )

          release_component = json.loads(
              (
                  root
                  / "Releases"
                  / f"switch-vision-{version}"
                  / "custom_components"
                  / "switch_vision"
                  / "manifest.json"
              ).read_text(encoding="utf-8")
          )

          release = json.loads(
              (
                  root
                  / "Releases"
                  / f"switch-vision-{version}"
                  / "manifest.json"
              ).read_text(encoding="utf-8")
          )

          assert component["version"] == version
          assert release_component["version"] == version
          assert release["version"] == version

          print(f"Core {version} version contract: PASS")
          PY

      - name: Reject generated cache material
        shell: bash
        run: |
          set -euo pipefail

          if find src Releases \
            \( \
              -type d -name '__pycache__' \
              -o -type f -name '*.pyc' \
              -o -type f -name '*.pyo' \
              -o -type f -name '.DS_Store' \
            \) | grep -q .; then
              echo "ERROR: generated cache/junk material found."
              exit 1
          fi

          echo "Core source hygiene: PASS"

      - name: Compile Python entry points
        run: |
          python3 -m py_compile \
            src/custom_components/switch_vision/__init__.py \
            src/custom_components/switch_vision/config_flow.py \
            src/devices/generate_supported_devices.py
