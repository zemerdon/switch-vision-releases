name: Build Core v2.4.1 Discovery model promotion

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/core-2.4.1-promote-discovery-models' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install build dependency
        run: python3 -m pip install --disable-pip-version-check PyYAML

      - name: Promote Discovery exact models
        run: python3 tools/promote_discovery_models_v241.py

      - name: Build Core 2.4.1
        run: python3 build.py -v 2.4.1

      - name: Validate promoted model set and source
        shell: bash
        run: |
          set -euo pipefail
          node --check src/js/switch-vision.js
          node --check src/custom_components/switch_vision/switch-vision-card.js
          python3 -m py_compile build.py src/devices/generate_supported_devices.py
          git diff --check

          python3 - <<'PY'
          import json
          import urllib.request
          from pathlib import Path

          promoted = {
              'N2128PX-ON',
              'US 48 PoE 500W',
              'US 8 60W',
              'USW Flex',
              'USW Flex 2.5G 8 PoE',
              'USW Flex Mini',
              'USW Pro 24',
              'USW-16-PoE',
              'USW-24-PoE',
              'USW-Lite-8-PoE',
              'UniFi Dream Machine PRO SE',
          }
          req = urllib.request.Request(
              'https://raw.githubusercontent.com/zemerdon/switch-vision-discovery/main/runtime_src/opt/switch-vision/devices/supported_devices.json',
              headers={'User-Agent': 'Switch-Vision-Core-Model-Promotion-Verify/1'},
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              discovery = json.loads(response.read().decode('utf-8'))
          core = json.loads(Path('src/devices/supported_devices.json').read_text(encoding='utf-8'))
          d = {str(x.get('model')): x for x in discovery.get('devices', []) if isinstance(x, dict)}
          c = {str(x.get('model')): x for x in core.get('devices', []) if isinstance(x, dict)}
          assert len(d) == 28, len(d)
          assert set(c) == set(d), (sorted(set(d) - set(c)), sorted(set(c) - set(d)))
          assert promoted.issubset(d), sorted(promoted - set(d))
          for model in sorted(promoted):
              assert c[model] == d[model], model
          print('Core/Discovery exact-model promotion: PASS (28/28 models; 11 promoted entries exact)')
          PY

      - name: Remove generated archives and temporary builder
        shell: bash
        run: |
          set -euo pipefail
          rm -f Releases/switch-vision-2.4.1.zip
          rm -f Releases/switch-vision-2.4.1.zip.sha256
          rm -f Switch_Vision_v2.4.1_source.zip
          rm -f Switch_Vision_v2.4.1_SHA256SUMS.txt
          rm -f SHA256SUMS
          rm -f .github/workflows/promote-discovery-models-v241.yml tools/promote_discovery_models_v241.py
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          git diff --check

      - name: Commit built Core 2.4.1 source
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo 'ERROR: builder produced no changes.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Core v2.4.1: promote Discovery exact models'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
