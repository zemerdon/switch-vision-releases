name: Build Core v2.4.0

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    if: ${{ github.event.head_commit.message == '[SV MAINT] build Core v2.4.0' }}
    name: Build Core v2.4.0 UniFi faceplate defaults
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install build dependency
        run: python3 -m pip install --disable-pip-version-check PyYAML

      - name: Apply v2.4.0 faceplate defaults, build, validate and push
        shell: bash
        run: |
          set -euo pipefail
          BRANCH='feature/core-2.4.0-unifi-faceplates'
          VERSION='2.4.0'
          ASSET='/home/zemerdon/unifi-24p-rj45-2sfp.png'
          EXPECTED_SHA='3843544aedd63e8d591fec3c77741686ce2820a1d49ab464cee2b25f23c1f7b7'

          git config user.name 'Switch Vision CI'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin "$BRANCH"
          git switch -C "$BRANCH" "origin/$BRANCH"

          test -f "$ASSET"
          test "$(sha256sum "$ASSET" | awk '{print $1}')" = "$EXPECTED_SHA"

          python3 <<'PY'
          from pathlib import Path
          import base64
          import json
          import struct
          import zlib

          src_asset = Path('/home/zemerdon/unifi-24p-rj45-2sfp.png')
          raw = src_asset.read_bytes()
          if raw[:8] != b'\x89PNG\r\n\x1a\n':
              raise SystemExit('STOP: UniFi asset is not a PNG')
          width, height = struct.unpack('>II', raw[16:24])
          if (width, height) != (1592, 149):
              raise SystemExit(f'STOP: unexpected UniFi asset dimensions {width}x{height}')
          dst_asset = Path('src/faceplates/unifi-24p-rj45-2sfp.png')
          dst_asset.write_bytes(raw)

          payloads = {
              'src/calibration/faceplate-stock-24rj45-2sfp.json': '',
              'src/calibration/faceplate-stock-24rj45-4sfp.json': '',
              'src/calibration/faceplate-unifi-24p-rj45-2sfp.json': '',
          }
          for filename, payload in payloads.items():
              data = json.loads(zlib.decompress(base64.b64decode(payload)).decode('utf-8'))
              Path(filename).write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          registry_path = Path('src/devices/supported_devices.yaml')
          lines = registry_path.read_text(encoding='utf-8').splitlines()
          in_ubiquiti = False
          in_visuals = False
          ubiquiti_models = 0
          replaced = {'profile': 0, 'faceplate': 0, 'visual_profile': 0, 'visual_faceplate': 0}
          output = []
          for line in lines:
              if line.startswith('- vendor: '):
                  in_ubiquiti = line == '- vendor: Ubiquiti'
                  in_visuals = False
                  if in_ubiquiti:
                      ubiquiti_models += 1
              if in_ubiquiti:
                  if line.startswith('  visuals:'):
                      in_visuals = True
                  elif line.startswith('  ') and not line.startswith('    ') and not line.startswith('  visuals:'):
                      if in_visuals:
                          in_visuals = False
                  if line.startswith('  calibration_profile:'):
                      line = '  calibration_profile: unifi_24p_rj45_2sfp'
                      replaced['profile'] += 1
                  elif line.startswith('  default_faceplate:'):
                      line = '  default_faceplate: faceplates/unifi-24p-rj45-2sfp.png'
                      replaced['faceplate'] += 1
                  elif in_visuals and line.startswith('    recommended_faceplate:'):
                      line = '    recommended_faceplate: faceplates/unifi-24p-rj45-2sfp.png'
                      replaced['visual_faceplate'] += 1
                  elif in_visuals and line.startswith('    calibration_profile:'):
                      line = '    calibration_profile: unifi_24p_rj45_2sfp'
                      replaced['visual_profile'] += 1
              output.append(line)
          if ubiquiti_models != 5:
              raise SystemExit(f'STOP: expected 5 Ubiquiti models, found {ubiquiti_models}')
          if any(value != ubiquiti_models for value in replaced.values()):
              raise SystemExit(f'STOP: incomplete Ubiquiti visual mapping update: {replaced}')
          registry_path.write_text('\n'.join(output) + '\n', encoding='utf-8')

          js_path = Path('src/js/switch-vision.js')
          js = js_path.read_text(encoding='utf-8')
          old_factory = '''function factoryCalibrationForProfile(profile) {
            return SV_FACTORY_CALIBRATIONS[String(profile || "").trim()] || null;
          }'''
          new_factory_lines = [
              'const SV_FACEPLATE_PROFILE_FILES = {',
              '  stock_24rj45_2sfp: "24rj45-2sfp.png",',
              '  stock_24rj45_4sfp: "24rj45-4sfp.png",',
              '  stock_48rj45_2sfp: "48rj45-2sfp.png",',
              '  stock_48rj45_4sfp: "48rj45-4sfp.png",',
              '  unifi_24p_rj45_2sfp: "unifi-24p-rj45-2sfp.png",',
              '};',
              'function factoryCalibrationForProfile(profile) {',
              '  const key = String(profile || "").trim();',
              '  const direct = SV_FACTORY_CALIBRATIONS[key];',
              '  if (direct) return direct;',
              '  const filename = SV_FACEPLATE_PROFILE_FILES[key];',
              '  return filename ? faceplateFactoryCalibrationForFile(filename) : null;',
              '}',
          ]
          new_factory = '\n'.join(new_factory_lines)
          if js.count(old_factory) != 1:
              raise SystemExit('STOP: expected one factoryCalibrationForProfile block')
          js_path.write_text(js.replace(old_factory, new_factory, 1), encoding='utf-8')

          faceplate_readme = Path('src/faceplates/README.txt')
          readme = faceplate_readme.read_text(encoding='utf-8')
          old_line = 'All faceplates use the standard Switch Vision 2048 x 448 canvas.\n'
          new_lines = [
              '- unifi-24p-rj45-2sfp.png — default faceplate for all UniFi / Ubiquiti models in v2.4.0',
              '',
              'Stock faceplates use the standard Switch Vision 2048 x 448 calibration canvas.',
              'The UniFi default uses native shallow artwork and is scaled by the Switch Vision card while retaining its bundled calibration defaults.',
              '',
          ]
          if 'unifi-24p-rj45-2sfp.png' not in readme:
              if old_line not in readme:
                  raise SystemExit('STOP: expected faceplate README canvas line')
              readme = readme.replace(old_line, '\n'.join(new_lines), 1)
          faceplate_readme.write_text(readme, encoding='utf-8')

          upgrading_path = Path('src/docs/UPGRADING.md')
          upgrading = upgrading_path.read_text(encoding='utf-8')
          heading = '## v2.4.0 faceplate defaults'
          if heading not in upgrading:
              marker = '## Recommended: Switch Vision Installer\n'
              if marker not in upgrading:
                  raise SystemExit('STOP: expected UPGRADING.md insertion point')
              note_lines = [
                  heading,
                  '',
                  'Switch Vision Core v2.4.0 updates several bundled faceplate defaults. Existing saved/custom faceplate calibrations are preserved during upgrade and are not overwritten automatically.',
                  '',
                  'To use the new v2.4.0 defaults on an existing switch, open Calibration and use **Reset Current Faceplate** (or reset/reload the faceplate to its current bundled default).',
                  '',
                  'Updated defaults:',
                  '',
                  '- all UniFi / Ubiquiti models now default to `unifi-24p-rj45-2sfp.png`;',
                  '- stock 24 RJ45 / 4 SFP faceplate calibration defaults are updated;',
                  '- stock 24 RJ45 / 2 SFP faceplate calibration defaults are updated.',
                  '',
              ]
              upgrading = upgrading.replace(marker, '\n'.join(note_lines) + '\n' + marker, 1)
          upgrading_path.write_text(upgrading, encoding='utf-8')

          notes = [
              '# Switch Vision Core v2.4.0 — UniFi faceplate refresh',
              '',
              'Switch Vision v2.4.0 introduces a new UniFi visual baseline and refreshed 24-port stock faceplate calibration defaults.',
              '',
              '## Highlights',
              '',
              '- All supported UniFi / Ubiquiti models now default to `unifi-24p-rj45-2sfp.png`.',
              '- Adds the new bundled UniFi 24 RJ45 / 2 SFP faceplate and its calibrated UI/port/SFP defaults.',
              '- Updates bundled defaults for stock 24 RJ45 / 4 SFP and stock 24 RJ45 / 2 SFP faceplates.',
              '- Existing saved/custom faceplate calibrations are preserved and are not overwritten during upgrade.',
              '- To adopt the new defaults on an existing switch, open Calibration and use Reset Current Faceplate / reload the current bundled default.',
              '- Keeps the v2.3.16 no-overlap TEST MODE placement behavior unchanged.',
              '',
              'After updating Core through Switch Vision Installer, restart Home Assistant Core when prompted.',
              '',
          ]
          Path('RELEASE_NOTES.md').write_text('\n'.join(notes), encoding='utf-8')

          changelog_path = Path('CHANGELOG.md')
          changelog = changelog_path.read_text(encoding='utf-8')
          changelog_heading = '## v2.4.0 — UniFi faceplate refresh'
          if changelog_heading not in changelog:
              marker = '# Changelog\n\n'
              if not changelog.startswith(marker):
                  raise SystemExit('STOP: unexpected CHANGELOG.md header')
              entry = [
                  changelog_heading,
                  '',
                  '- Adds `unifi-24p-rj45-2sfp.png` and makes it the default faceplate for all UniFi / Ubiquiti exact-model recommendations.',
                  '- Adds bundled UniFi faceplate calibration defaults and updates stock 24 RJ45 / 2 SFP and 24 RJ45 / 4 SFP factory defaults.',
                  '- Preserves existing saved/custom faceplate profiles; existing switches can use Reset Current Faceplate to adopt the new defaults.',
                  '- Keeps v2.3.16 TEST MODE no-overlap placement unchanged.',
                  '- Changes Home Assistant integration/card/assets; restart Home Assistant Core after updating.',
                  '',
                  '',
              ]
              changelog_path.write_text(marker + '\n'.join(entry) + changelog[len(marker):], encoding='utf-8')
          PY

          node --check src/js/switch-vision.js
          git diff --check
          python3 build.py -v "$VERSION"

          rm -f \
            "Releases/switch-vision-$VERSION.zip" \
            "Releases/switch-vision-$VERSION.zip.sha256" \
            "Switch_Vision_v${VERSION}_source.zip" \
            "Switch_Vision_v${VERSION}_SHA256SUMS.txt"

          test "$(cat VERSION)" = "$VERSION"
          test -d "Releases/switch-vision-$VERSION"
          test -f "src/faceplates/unifi-24p-rj45-2sfp.png"
          test -f "Releases/switch-vision-$VERSION/faceplates/unifi-24p-rj45-2sfp.png"
          test "$(sha256sum src/faceplates/unifi-24p-rj45-2sfp.png | awk '{print $1}')" = "$EXPECTED_SHA"
          test "$(sha256sum Releases/switch-vision-$VERSION/faceplates/unifi-24p-rj45-2sfp.png | awk '{print $1}')" = "$EXPECTED_SHA"

          node --check src/js/switch-vision.js
          python3 tools/check_core_release_parity.py
          git diff --check

          python3 - <<'PY'
          from pathlib import Path
          import json
          import yaml

          registry = yaml.safe_load(Path('src/devices/supported_devices.yaml').read_text(encoding='utf-8'))
          ubi = [item for item in registry['devices'] if item.get('vendor') == 'Ubiquiti']
          if len(ubi) != 5:
              raise SystemExit('STOP: expected five Ubiquiti registry entries after build')
          for item in ubi:
              if item.get('default_faceplate') != 'faceplates/unifi-24p-rj45-2sfp.png':
                  raise SystemExit(f"STOP: stale Ubiquiti default faceplate for {item.get('model')}")
              if item.get('calibration_profile') != 'unifi_24p_rj45_2sfp':
                  raise SystemExit(f"STOP: stale Ubiquiti calibration profile for {item.get('model')}")
              visuals = item.get('visuals') or {}
              if visuals.get('recommended_faceplate') != 'faceplates/unifi-24p-rj45-2sfp.png':
                  raise SystemExit(f"STOP: stale Ubiquiti visual recommendation for {item.get('model')}")
              if visuals.get('calibration_profile') != 'unifi_24p_rj45_2sfp':
                  raise SystemExit(f"STOP: stale Ubiquiti visual profile for {item.get('model')}")

          for path, expected_profile, expected_ports, expected_sfps in [
              ('src/calibration/faceplate-stock-24rj45-2sfp.json', 'stock_24rj45_2sfp', 24, 2),
              ('src/calibration/faceplate-stock-24rj45-4sfp.json', 'stock_24rj45_4sfp', 24, 4),
              ('src/calibration/faceplate-unifi-24p-rj45-2sfp.json', 'unifi_24p_rj45_2sfp', 24, 2),
          ]:
              data = json.loads(Path(path).read_text(encoding='utf-8'))
              if data.get('profile') != expected_profile:
                  raise SystemExit(f'STOP: wrong factory profile in {path}')
              if len(data.get('ports') or {}) != expected_ports or len(data.get('sfp') or {}) != expected_sfps:
                  raise SystemExit(f'STOP: wrong factory topology in {path}')
          PY

          if find src "Releases/switch-vision-$VERSION" \
            \( -type d -name '__pycache__' -o -type f -name '*.pyc' -o -type f -name '*.pyo' -o -type f -name '.DS_Store' \) \
            | grep -q .; then
            echo 'STOP: generated cache/junk material found after build'
            exit 1
          fi

          git add -A
          if git diff --cached --name-only | grep -E '\.(zip|pyc|pyo)$|SHA256SUMS|\.zip\.sha256$'; then
            echo 'STOP: archive/checksum/cache output was staged'
            exit 1
          fi
          git diff --cached --check
          git commit -m 'Build Switch Vision Core v2.4.0'
          git push origin "HEAD:$BRANCH"
