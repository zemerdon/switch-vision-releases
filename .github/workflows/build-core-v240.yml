name: Build Core v2.4.0 from PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    if: ${{ github.event.pull_request.head.ref == 'feature/core-2.4.0-unifi-faceplates' }}
    name: Build Core v2.4.0 UniFi faceplate defaults
    runs-on: ubuntu-latest

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install build dependency
        run: python3 -m pip install --disable-pip-version-check PyYAML

      - name: Build, validate and push Core v2.4.0
        shell: bash
        env:
          ASSET_URL: 'https://sdmntpraustraliaeast.oaiusercontent.com/files/00000000-9768-81fa-91bb-5d4aad8e59f8/raw?se=2026-08-20T16%3A57%3A52Z&sp=r&sv=2026-02-06&sr=b&scid=1f9977d5-95aa-5713-9ff0-ab5777641884&skoid=697dc613-6c29-4a76-87a7-d1b783c6d43f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-20T01%3A15%3A41Z&ske=2026-08-21T01%3A15%3A41Z&sks=b&skv=2026-02-06&sig=gJuh2fSav/7pIfD4smAqejcnuhpo9bi3M9SmOCMErVM%3D'
        run: |
          set -euo pipefail
          BRANCH='feature/core-2.4.0-unifi-faceplates'
          if [ ! -f tools/_sv_v240_build.py ]; then
            echo 'Core v2.4.0 feature branch is already built; nothing to do.'
            exit 0
          fi
          python3 tools/_sv_v240_build.py "$ASSET_URL"
          git config user.name 'Switch Vision CI'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git status --short
          git diff --cached --quiet && { echo 'STOP: v2.4.0 build produced no commit'; exit 1; }
          git commit -m 'Core v2.4.0: UniFi faceplate defaults'
          git push origin "HEAD:$BRANCH"
