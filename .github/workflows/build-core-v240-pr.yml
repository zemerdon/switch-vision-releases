name: Build Core v2.4.0 from PR

on:
  pull_request:
    types: [opened]
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    if: ${{ github.event.pull_request.head.ref == 'feature/core-2.4.0-unifi-faceplates' }}
    name: Build Core v2.4.0 UniFi faceplate defaults
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install build dependency
        run: python3 -m pip install --disable-pip-version-check PyYAML

      - name: Build and push v2.4.0 feature branch
        shell: bash
        run: |
          set -euo pipefail
          BRANCH='feature/core-2.4.0-unifi-faceplates'
          VERSION='2.4.0'
          ASSET='/home/zemerdon/unifi-24p-rj45-2sfp.png'
          EXPECTED_SHA='3843544aedd63e8d591fec3c77741686ce2820a1d49ab464cee2b25f23c1f7b7'

          git config user.name 'Switch Vision CI'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin "$BRANCH"
          git switch -C "$BRANCH" "origin/$BRANCH"

          test -f "$ASSET"
          test "$(sha256sum "$ASSET" | awk '{print $1}')" = "$EXPECTED_SHA"
          cp "$ASSET" src/faceplates/unifi-24p-rj45-2sfp.png

          python3 <<'PY'
          from pathlib import Path
          import base64
          import zlib
          import yaml

          payloads = {
              'src/calibration/faceplate-stock-24rj45-2sfp.json': '',
              'src/calibration/faceplate-stock-24rj45-4sfp.json': '',
              'src/calibration/faceplate-unifi-24p-rj45-2sfp.json': ''
          }
          for path, payload in payloads.items():
              Path(path).write_bytes(zlib.decompress(base64.b64decode(payload)))

          registry_path = Path('src/devices/supported_devices.yaml')
          registry = yaml.safe_load(registry_path.read_text(encoding='utf-8'))
          changed = 0
          for device in registry.get('devices', []):
              if str(device.get('vendor', '')).strip().lower() != 'ubiquiti':
                  continue
              previous = str(device.get('default_faceplate', '')).strip()
              device['default_faceplate'] = 'faceplates/unifi-24p-rj45-2sfp.png'
              visuals = device.setdefault('visuals', {})
              visuals['recommended_faceplate'] = 'faceplates/unifi-24p-rj45-2sfp.png'
              notes = device.setdefault('notes', [])
              note = 'Switch Vision v2.4.0 uses the dedicated UniFi faceplate as the family-wide default artwork while retaining the model-specific topology profile.'
              if note not in notes:
                  notes.append(note)
              changed += 1
          if changed < 1:
              raise SystemExit('STOP: no Ubiquiti device entries were updated')
          registry_path.write_text(yaml.safe_dump(registry, sort_keys=False, allow_unicode=True), encoding='utf-8', newline='\n')

          readme = Path('src/faceplates/README.txt')
          text = readme.read_text(encoding='utf-8')
          line = '- unifi-24p-rj45-2sfp.png — dedicated UniFi artwork; family-wide default faceplate for current Ubiquiti/UniFi models in v2.4.0, with its own 24 RJ45 / 2 SFP faceplate calibration defaults\n'
          if 'unifi-24p-rj45-2sfp.png' not in text:
              readme.write_text(text.rstrip() + '\n' + line, encoding='utf-8', newline='\n')

          upgrading = Path('src/docs/UPGRADING.md')
          text = upgrading.read_text(encoding='utf-8')
          heading = '## v2.4.0 faceplate default changes'
          if heading not in text:
              block = '\n'.join([
                  heading,
                  '',
                  'Switch Vision v2.4.0 updates the shipped faceplate defaults. Existing saved/custom calibration profiles are preserved and are not silently overwritten.',
                  '',
                  'Affected defaults:',
                  '',
                  '- All current Ubiquiti/UniFi models now recommend `unifi-24p-rj45-2sfp.png` as their default faceplate artwork.',
                  '- The stock `24rj45-2sfp.png` calibration defaults were updated.',
                  '- The stock `24rj45-4sfp.png` calibration defaults were updated.',
                  '- The dedicated UniFi faceplate includes its own 24 RJ45 / 2 SFP faceplate calibration defaults.',
                  '',
                  'For an existing switch that should adopt the new shipped baseline, open Calibration and use **Reset Current Faceplate** or **Reset Current Switch** as appropriate. This intentionally discards the saved calibration being reset and reloads the current bundled defaults.',
                  ''
              ])
              marker = '## Recommended: Switch Vision Installer'
              if marker not in text:
                  raise SystemExit('STOP: UPGRADING.md insertion marker missing')
              text = text.replace(marker, block + '\n' + marker, 1)
              upgrading.write_text(text, encoding='utf-8', newline='\n')
          PY

          rm -f .sv-v240-pr-trigger

          python3 build.py -v "$VERSION"
          node --check src/js/switch-vision.js
          node --check src/custom_components/switch_vision/switch-vision-card.js
          python3 -m py_compile build.py src/devices/generate_supported_devices.py
          git diff --check
          test "$(cat VERSION)" = "$VERSION"
          test -d "Releases/switch-vision-$VERSION"
          test -f src/faceplates/unifi-24p-rj45-2sfp.png
          test "$(sha256sum src/faceplates/unifi-24p-rj45-2sfp.png | awk '{print $1}')" = "$EXPECTED_SHA"

          git add VERSION src "Releases/switch-vision-$VERSION" .sv-v240-pr-trigger
          if git diff --cached --quiet; then
            echo 'STOP: build produced no staged v2.4.0 changes' >&2
            exit 1
          fi
          git commit -m 'Core v2.4.0: UniFi faceplate defaults'
          git push origin "HEAD:$BRANCH"
