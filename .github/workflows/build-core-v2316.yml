name: Build Core v2.3.16

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    if: ${{ github.event.head_commit.message == '[SV MAINT] build Core v2.3.16' }}
    name: Build Core v2.3.16 no-overlap Test Mode placement
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install build dependency
        run: python3 -m pip install --disable-pip-version-check PyYAML

      - name: Patch, build, validate and push v2.3.16
        shell: bash
        run: |
          set -euo pipefail
          BRANCH='feature/core-2.3.16-test-mode-no-overlap'
          VERSION='2.3.16'

          git config user.name 'Switch Vision CI'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin "$BRANCH"
          git switch -C "$BRANCH" "origin/$BRANCH"

          python3 <<'PY'
          from pathlib import Path

          js_path = Path('src/js/switch-vision.js')
          text = js_path.read_text(encoding='utf-8')

          old_top = '  `top:calc(${((y + height) / designHeight) * 100}% + 10px)`,'
          new_top = '  `top:calc(${((y + height) / designHeight) * 100}% + 30px)`,'
          if text.count(old_top) != 1:
              raise SystemExit('STOP: expected one v2.3.15 TEST MODE top style')
          text = text.replace(old_top, new_top, 1)

          marker = '    this.attachCalibrationButtonHandler();'
          if text.count(marker) != 1:
              raise SystemExit('STOP: expected one calibration button handler attachment')

          placement_lines = [
              marker,
              '    const positionTestMode = () => {',
              '      const stage = this.shadowRoot?.querySelector(".cv-stage");',
              '      const button = this.shadowRoot?.querySelector(\'[data-cv-action="toggle-calibration"]\');',
              '      const testMode = this.shadowRoot?.querySelector(".cv-cal-test-mode-badge");',
              '      if (!stage || !button || !testMode) return;',
              '      const stageRect = stage.getBoundingClientRect();',
              '      const buttonRect = button.getBoundingClientRect();',
              '      const testRect = testMode.getBoundingClientRect();',
              '      if (!stageRect.width || !stageRect.height || !buttonRect.width || !buttonRect.height || !testRect.width || !testRect.height) return;',
              '      const gap = 30;',
              '      const buttonLeft = buttonRect.left - stageRect.left;',
              '      const buttonRight = buttonRect.right - stageRect.left;',
              '      const buttonTop = buttonRect.top - stageRect.top;',
              '      const buttonBottom = buttonRect.bottom - stageRect.top;',
              '      const testWidth = testRect.width;',
              '      const testHeight = testRect.height;',
              '      const candidates = [',
              '        { left: buttonLeft, top: buttonBottom + gap },',
              '        { left: buttonLeft, top: buttonTop - testHeight - gap },',
              '        { left: buttonLeft - testWidth - gap, top: buttonTop },',
              '        { left: buttonRight + gap, top: buttonTop },',
              '      ];',
              '      const fits = ({ left, top }) => (',
              '        left >= 0',
              '        && top >= 0',
              '        && left + testWidth <= stageRect.width',
              '        && top + testHeight <= stageRect.height',
              '      );',
              '      let chosen = candidates.find(fits);',
              '      if (!chosen) {',
              '        const fallbackCandidates = [',
              '          { left: 4, top: 4 },',
              '          { left: Math.max(4, stageRect.width - testWidth - 4), top: 4 },',
              '          { left: 4, top: Math.max(4, stageRect.height - testHeight - 4) },',
              '          { left: Math.max(4, stageRect.width - testWidth - 4), top: Math.max(4, stageRect.height - testHeight - 4) },',
              '        ];',
              '        const overlapsButton = ({ left, top }) => (',
              '          left < buttonRight',
              '          && left + testWidth > buttonLeft',
              '          && top < buttonBottom',
              '          && top + testHeight > buttonTop',
              '        );',
              '        chosen = fallbackCandidates.find((candidate) => fits(candidate) && !overlapsButton(candidate));',
              '      }',
              '      if (!chosen) {',
              '        testMode.style.display = "none";',
              '        return;',
              '      }',
              '      testMode.style.display = "";',
              '      testMode.style.left = `${chosen.left}px`;',
              '      testMode.style.top = `${chosen.top}px`;',
              '    };',
              '    positionTestMode();',
              '    requestAnimationFrame(positionTestMode);',
              '    if (this._testModeResizeObserver) this._testModeResizeObserver.disconnect();',
              '    const testModeStage = this.shadowRoot?.querySelector(".cv-stage");',
              '    if (testModeStage && typeof ResizeObserver !== "undefined") {',
              '      this._testModeResizeObserver = new ResizeObserver(positionTestMode);',
              '      this._testModeResizeObserver.observe(testModeStage);',
              '    }',
          ]
          text = text.replace(marker, '\n'.join(placement_lines), 1)

          old_load = '      if (faceplateImage.complete && faceplateImage.naturalWidth) updateInfo(); else faceplateImage.addEventListener("load", updateInfo, {once:true});'
          new_load = '      if (faceplateImage.complete && faceplateImage.naturalWidth) { updateInfo(); positionTestMode(); } else faceplateImage.addEventListener("load", () => { updateInfo(); positionTestMode(); }, {once:true});'
          if text.count(old_load) != 1:
              raise SystemExit('STOP: expected one faceplate image completion handler')
          text = text.replace(old_load, new_load, 1)
          js_path.write_text(text, encoding='utf-8')

          notes = [
              '# Switch Vision Core v2.3.16 — No-overlap Test Mode placement',
              '',
              '- Keeps Calibrate exactly where the profile places it.',
              '- Measures the actual rendered Calibrate and TEST MODE controls in the browser.',
              '- Prefers a true 30 px edge-to-edge gap below Calibrate.',
              '- Falls back above, then left or right when the preferred position does not fit.',
              '- Recalculates after faceplate image load and when the rendered faceplate resizes.',
              '- Guarantees TEST MODE will not overlap Calibrate; in an impossibly small stage it hides the faceplate badge rather than overlap the control.',
              '- Keeps all existing Test Mode persistence behaviour unchanged.',
              '',
              'After updating Core through Switch Vision Installer, restart Home Assistant Core when prompted.',
              '',
          ]
          Path('RELEASE_NOTES.md').write_text('\n'.join(notes), encoding='utf-8')

          changelog_path = Path('CHANGELOG.md')
          changelog = changelog_path.read_text(encoding='utf-8')
          heading = '## v2.3.16 — No-overlap Test Mode placement'
          if heading not in changelog:
              marker = '# Changelog\n\n'
              if not changelog.startswith(marker):
                  raise SystemExit('STOP: unexpected CHANGELOG.md header')
              entry = [
                  heading,
                  '',
                  '- Positions TEST MODE from actual rendered browser geometry instead of calibration design-space button dimensions.',
                  '- Prefers a real 30 px gap below Calibrate and automatically falls back above or horizontally when needed.',
                  '- Recalculates placement after faceplate load and responsive stage resizing.',
                  '- Prevents TEST MODE from overlapping Calibrate on shallow or unusual-aspect faceplates.',
                  '- Keeps all Test Mode persistence behaviour unchanged.',
                  '- Changes the Home Assistant custom integration/card files; restart Home Assistant Core after updating.',
                  '',
                  '',
              ]
              changelog_path.write_text(marker + '\n'.join(entry) + changelog[len(marker):], encoding='utf-8')
          PY

          node --check src/js/switch-vision.js
          git diff --check
          python3 build.py -v "$VERSION"

          rm -f \
            "Releases/switch-vision-$VERSION.zip" \
            "Releases/switch-vision-$VERSION.zip.sha256" \
            "Switch_Vision_v${VERSION}_source.zip" \
            "Switch_Vision_v${VERSION}_SHA256SUMS.txt"

          test "$(cat VERSION)" = "$VERSION"
          test -d "Releases/switch-vision-$VERSION"
          node --check src/js/switch-vision.js
          python3 tools/check_core_release_parity.py
          git diff --check

          if find src "Releases/switch-vision-$VERSION" \
            \( -type d -name '__pycache__' -o -type f -name '*.pyc' -o -type f -name '*.pyo' -o -type f -name '.DS_Store' \) \
            | grep -q .; then
            echo 'STOP: generated cache/junk material found after build'
            exit 1
          fi

          git add -A
          if git diff --cached --name-only | grep -E '\.(zip|pyc|pyo)$|SHA256SUMS|\.zip\.sha256$'; then
            echo 'STOP: archive/checksum/cache output was staged'
            exit 1
          fi
          git diff --cached --check
          git commit -m 'Build Switch Vision Core v2.3.16'
          git push origin "HEAD:$BRANCH"
