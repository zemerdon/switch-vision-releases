name: Publish Core v2.3.12

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish:
    if: ${{ github.event.head_commit.message == '[SV RELEASE] publish Core v2.3.12' }}
    name: Publish Core v2.3.12
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: "2.3.12"
      PREVIOUS_VERSION: "2.3.11"
      TARGET_SHA: "2f21fa73b3fe3bb52abb278ff446ee98eb00f611"

    steps:
      - name: Checkout clean release commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install build dependency
        run: python3 -m pip install --disable-pip-version-check PyYAML

      - name: Verify release does not already exist
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "STOP: GitHub Release $VERSION already exists"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "STOP: tag $VERSION already exists"
            exit 1
          fi

      - name: Rebuild and verify deterministic tracked output
        shell: bash
        run: |
          set -euo pipefail
          python3 build.py -v "$VERSION"
          git diff --exit-code
          test "$(cat VERSION)" = "$VERSION"
          test -f "Releases/switch-vision-$VERSION.zip"
          test -f "Releases/switch-vision-$VERSION.zip.sha256"
          test -f "Switch_Vision_v${VERSION}_source.zip"
          test -f "Switch_Vision_v${VERSION}_SHA256SUMS.txt"
          node --check src/js/switch-vision.js
          python3 tools/check_core_release_parity.py

      - name: Publish tag, release notes and matching assets
        shell: bash
        run: |
          set -euo pipefail

          previous_assets="$(gh release view "$PREVIOUS_VERSION" --json assets --jq '.assets[].name' 2>/dev/null || true)"
          printf 'Previous release assets:\n%s\n' "$previous_assets"

          assets=(
            "Releases/switch-vision-$VERSION.zip"
            "Releases/switch-vision-$VERSION.zip.sha256"
          )

          if grep -Fxq "Switch_Vision_v${PREVIOUS_VERSION}_source.zip" <<<"$previous_assets"; then
            assets+=("Switch_Vision_v${VERSION}_source.zip")
          fi
          if grep -Fxq "Switch_Vision_v${PREVIOUS_VERSION}_SHA256SUMS.txt" <<<"$previous_assets"; then
            assets+=("Switch_Vision_v${VERSION}_SHA256SUMS.txt")
          fi

          printf 'Publishing assets:\n'
          printf '  %s\n' "${assets[@]}"

          gh release create "$VERSION" \
            --target "$TARGET_SHA" \
            --title "Switch Vision Core v$VERSION — Persistent Calibration LED Test Mode" \
            --notes-file RELEASE_NOTES.md \
            "${assets[@]}"

          gh release view "$VERSION" --json tagName,name,isDraft,isPrerelease,assets
