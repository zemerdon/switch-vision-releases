name: Apply EX3300 generator source fix

on:
  push:
    branches:
      - audit/ex3300-shared-registry-fix
    paths:
      - tools/apply_ex3300_generator_source_fix.py
      - .github/workflows/apply-ex3300-generator-source-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4
        with:
          ref: audit/ex3300-shared-registry-fix
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependency
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Correct authoritative YAML and rebuild
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_ex3300_generator_source_fix.py
          VERSION="$(cat VERSION)"
          python3 build.py -v "$VERSION"
          rm -f \
            "Releases/switch-vision-$VERSION.zip" \
            "Releases/switch-vision-$VERSION.zip.sha256" \
            "Switch_Vision_v${VERSION}_source.zip" \
            "Switch_Vision_v${VERSION}_SHA256SUMS.txt"
          find src Releases -type d -name '__pycache__' -prune -exec rm -rf {} +
          find src Releases -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          git status --short

      - name: Commit deterministic source/output correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "switch-vision-bot"
          git config user.email "switch-vision-bot@users.noreply.github.com"
          git add -u src Releases
          if git diff --cached --quiet; then
            echo "No generated changes required."
            exit 0
          fi
          git commit -m "Correct EX3300 authoritative generated registry contract"
          git push origin HEAD:audit/ex3300-shared-registry-fix
