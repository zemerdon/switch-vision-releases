name: Publish Core v2.3.14

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish:
    if: ${{ github.event.head_commit.message == '[SV RELEASE] publish Core v2.3.14' }}
    name: Publish and verify Core v2.3.14
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: "2.3.14"
      PREVIOUS_VERSION: "2.3.13"
      TARGET_SHA: "d801f94f4333ad71736b648cc8b91305f08b0d1e"

    steps:
      - name: Checkout clean release commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install build dependency
        run: python3 -m pip install --disable-pip-version-check PyYAML

      - name: Verify release does not already exist
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "STOP: GitHub Release $VERSION already exists"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "STOP: tag $VERSION already exists"
            exit 1
          fi

      - name: Rebuild clean release commit
        shell: bash
        run: |
          set -euo pipefail
          python3 build.py -v "$VERSION"
          git diff --exit-code
          test "$(cat VERSION)" = "$VERSION"
          test -f "Releases/switch-vision-$VERSION.zip"
          test -f "Releases/switch-vision-$VERSION.zip.sha256"
          test -f "Switch_Vision_v${VERSION}_source.zip"
          test -f "Switch_Vision_v${VERSION}_SHA256SUMS.txt"
          node --check src/js/switch-vision.js
          python3 tools/check_core_release_parity.py

      - name: Publish GitHub release
        shell: bash
        run: |
          set -euo pipefail
          previous_assets="$(gh release view "$PREVIOUS_VERSION" --json assets --jq '.assets[].name' 2>/dev/null || true)"
          assets=(
            "Releases/switch-vision-$VERSION.zip"
            "Releases/switch-vision-$VERSION.zip.sha256"
          )
          if grep -Fxq "Switch_Vision_v${PREVIOUS_VERSION}_source.zip" <<<"$previous_assets"; then
            assets+=("Switch_Vision_v${VERSION}_source.zip")
          fi
          if grep -Fxq "Switch_Vision_v${PREVIOUS_VERSION}_SHA256SUMS.txt" <<<"$previous_assets"; then
            assets+=("Switch_Vision_v${VERSION}_SHA256SUMS.txt")
          fi
          gh release create "$VERSION" \
            --target "$TARGET_SHA" \
            --title "Switch Vision Core v$VERSION — Test Mode control spacing" \
            --notes-file RELEASE_NOTES.md \
            "${assets[@]}"

      - name: Verify published release
        shell: bash
        run: |
          set -euo pipefail
          current_assets="$(gh release view "$VERSION" --json assets --jq '.assets[].name')"
          previous_assets="$(gh release view "$PREVIOUS_VERSION" --json assets --jq '.assets[].name' 2>/dev/null || true)"

          require_asset() {
            local name="$1"
            if ! grep -Fxq "$name" <<<"$current_assets"; then
              echo "STOP: required release asset missing: $name"
              exit 1
            fi
          }

          require_asset "switch-vision-$VERSION.zip"
          require_asset "switch-vision-$VERSION.zip.sha256"
          if grep -Fxq "Switch_Vision_v${PREVIOUS_VERSION}_source.zip" <<<"$previous_assets"; then
            require_asset "Switch_Vision_v${VERSION}_source.zip"
          fi
          if grep -Fxq "Switch_Vision_v${PREVIOUS_VERSION}_SHA256SUMS.txt" <<<"$previous_assets"; then
            require_asset "Switch_Vision_v${VERSION}_SHA256SUMS.txt"
          fi

          git fetch --force origin "refs/tags/$VERSION:refs/tags/$VERSION"
          tag_commit="$(git rev-parse "$VERSION^{commit}")"
          test "$tag_commit" = "$TARGET_SHA"
          test "$(gh release view "$VERSION" --json isDraft --jq '.isDraft')" = "false"
          test "$(gh release view "$VERSION" --json isPrerelease --jq '.isPrerelease')" = "false"

          git fetch origin main
          git switch -C main origin/main
          {
            echo "Switch Vision Core v$VERSION release verification: PASS"
            echo "tag_commit=$tag_commit"
            echo "assets:"
            printf '%s\n' "$current_assets"
          } > .sv-core-v2314-release-verified

          git config user.name 'Switch Vision CI'
          git config user.email 'actions@users.noreply.github.com'
          git add .sv-core-v2314-release-verified
          git commit -m 'Verify Switch Vision Core v2.3.14 release'
          git push origin HEAD:main
