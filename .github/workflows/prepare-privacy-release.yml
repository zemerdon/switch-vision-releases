name: Prepare Core privacy maintenance release

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  prepare:
    if: github.head_ref == 'privacy/core-public-release-policy-2411-r2'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout review branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: privacy/core-public-release-policy-2411-r2
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install dependency
        run: python3 -m pip install --disable-pip-version-check PyYAML
      - name: Neutralize legacy attribution regression identifiers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          old = Path('tests/test_brendan_unifi_contracts.py')
          if old.exists():
              old.unlink()

          neutral = Path('tests/test_unifi_community_contracts.py')
          neutral.write_text('''from __future__ import annotations

import json
from pathlib import Path
import yaml

ROOT = Path(__file__).resolve().parents[1]
SOURCE = ROOT / "src" / "devices" / "supported_devices.yaml"
GENERATED = ROOT / "src" / "devices" / "supported_devices.json"

source_doc = yaml.safe_load(SOURCE.read_text(encoding="utf-8")) or {}
source_models = {d["model"]: d for d in source_doc["devices"] if isinstance(d, dict)}

expected = {
    "UCG Ultra": (5, 0, False, False, "ubiquiti-ucg-ultra-api"),
    "US 16 PoE 150W": (16, 2, True, False, "ubiquiti-us-16-poe-150w-api"),
    "USW Pro Max 24": (24, 2, False, True, "ubiquiti-usw-pro-max-24-api"),
    "USW Ultra": (8, 0, True, False, "ubiquiti-usw-ultra-api"),
}
for model, (rj45, uplinks, poe, dashboard, profile) in expected.items():
    item = source_models[model]
    expected_status = "experimental" if model == "USW Pro Max 24" else "detected"
    assert item["status"] == expected_status, model
    assert item["ports"]["rj45"] == rj45, model
    assert item["ports"]["uplinks"] == uplinks, model
    assert item["ports"]["poe"] is poe, model
    assert item["dashboard_support"] is dashboard, model
    assert item["mapping_profile"] == profile, model
    contributions = item.get("contributions") or []
    assert len(contributions) >= 1, model
    for contribution in contributions:
        contributor = contribution.get("contributor") or {}
        assert str(contributor.get("display_name") or "").casefold() == "community contributor", model
        assert contributor.get("public_credit") is False, model
        assert contribution["api_capabilities"]["per_port_traffic"] is False, model

promax = source_models["USW Pro Max 24"]
assert promax["default_faceplate"] == "faceplates/unifi-24p-rj45-2sfp.png"
assert promax["calibration_profile"] == "unifi_24p_rj45_2sfp"
assert "ports 17-24 are 2.5G-capable RJ45" in " ".join(promax["notes"])
assert "ports_25_26_10g_sfp_plus" in promax["validation"]["uplinks"]

us16 = source_models["US 16 PoE 150W"]
assert "ports_17_18_1g_sfp" in us16["validation"]["uplinks"]
ultra = source_models["USW Ultra"]
assert "ports_1_7_only" in ultra["validation"]["poe"]
ucg = source_models["UCG Ultra"]
assert "no_poe_output" in ucg["validation"]["poe"]

for model in ("UCG Ultra", "US 16 PoE 150W", "USW Ultra"):
    item = source_models[model]
    assert item["default_faceplate"] == "", model
    assert item["calibration_profile"] == "", model

generated = json.loads(GENERATED.read_text(encoding="utf-8"))
generated_models = {d["model"]: d for d in generated["devices"] if isinstance(d, dict)}
for model in expected:
    assert generated_models[model] == source_models[model], model

print("Switch Vision Core UniFi community hardware contracts: PASS")
''', encoding='utf-8', newline='\n')

          contracts = Path('tests/test_device_registry_contracts.py')
          if contracts.exists():
              text = contracts.read_text(encoding='utf-8')
              text = text.replace(
                  'test_sv_2026_000002_existing_models_gain_evidence_without_promotion',
                  'test_existing_models_gain_community_evidence_without_promotion',
              )
              contracts.write_text(text, encoding='utf-8', newline='\n')
          PY
      - name: Sanitize and build Core 2.4.11
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/sanitize_public_attribution.py --core-version 2.4.11
          python3 build.py -v 2.4.11
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 tools/check_core_release_parity.py
          node --check src/js/switch-vision.js
          node --check src/custom_components/switch_vision/switch-vision-card.js
          git diff --check
      - name: Restore normal CI and remove remediation scaffolding
        shell: bash
        run: |
          set -euo pipefail
          git show 096c81b5e5b3884034043d2775b9b336a50d0edb:.github/workflows/validate-core-source.yml > .github/workflows/validate-core-source.yml
          rm -f .github/workflows/prepare-public-attribution-policy.yml .github/workflows/prepare-privacy-release.yml .privacy-remediation-trigger
      - name: Commit validated product tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'switch-vision-release-bot'
          git config user.email 'switch-vision@users.noreply.github.com'
          git add -A
          git commit -m 'Core v2.4.11: enforce public attribution privacy policy'
          git push origin HEAD:privacy/core-public-release-policy-2411-r2
