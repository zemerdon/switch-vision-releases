name: Prepare Core v2.4.13 UI regression fixes

on:
  push:
    branches:
      - review/inbox-audit-core-2.4.13

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Check out review branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install build dependency
        run: python3 -m pip install --disable-pip-version-check PyYAML

      - name: Apply UI regression fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          version = '2.4.13'

          card_path = Path('src/js/switch-vision.js')
          card = card_path.read_text(encoding='utf-8')
          pattern = re.compile(
              r'(const addHitbox = \(type, id, item\) => \{\n)'
              r'(?P<i>\s*)if \(!item\?\.center \|\| !item\?\.hitbox\) return;\n'
              r'(?P=i)const \[cx, cy\] = item\.center;\n'
              r'(?P=i)const \[w, h\] = visualHitboxSize\(type, item\.hitbox\);'
          )

          def replacement(match):
              indent = match.group('i')
              return (
                  match.group(1)
                  + f'{indent}if (!item?.center) return;\n'
                  + f'{indent}const fallbackHitbox = type === "port" ? [34, 56] : [94, 48];\n'
                  + f'{indent}const [cx, cy] = item.center;\n'
                  + f'{indent}const [w, h] = visualHitboxSize(type, item.hitbox || fallbackHitbox);'
              )

          card, count = pattern.subn(replacement, card, count=1)
          if count != 1:
              raise SystemExit(f'Expected one addHitbox gate, found {count}')
          card_path.write_text(card, encoding='utf-8', newline='\n')

          panel_path = Path('src/custom_components/switch_vision/switch-vision-panel.js')
          panel = panel_path.read_text(encoding='utf-8')
          old_meta = '.meta{font-family:monospace;white-space:pre-wrap;word-break:break-word;background:#0d1216;padding:12px;border-radius:8px;max-height:320px;overflow:auto}'
          new_meta = '.meta{font-family:monospace;white-space:pre-wrap;word-break:break-word;background:#0d1216;color:#e8eef3;padding:12px;border-radius:8px;max-height:320px;overflow:auto}'
          if panel.count(old_meta) != 1:
              raise SystemExit(f'Expected one diagnostics meta rule, found {panel.count(old_meta)}')
          panel_path.write_text(panel.replace(old_meta, new_meta, 1), encoding='utf-8', newline='\n')

          Path('VERSION').write_text(version + '\n', encoding='utf-8', newline='\n')

          release_notes = f'''# Switch Vision Core v{version}

Core {version} fixes two dashboard UI regressions observed on a community-validated Zyxel XS1930-10.

Rendered ports now remain selectable when a saved or custom calibration contains the port centre but omits an explicit hitbox. Switch Vision derives the normal visual hitbox for the rendered socket rather than allowing the click to fall through to the switch-summary background handler. Blank interface descriptions continue to display as `DESC —` while the port remains selected.

The native dashboard Advanced diagnostics block now uses an explicit light foreground on its fixed dark background, keeping diagnostic text readable under Home Assistant themes whose primary text colour is dark.

No device mapping, telemetry, faceplate geometry, Discovery, SNMP2MQTT, or UniFi2MQTT behaviour changes are included in this corrective release.
'''
          for path in (Path('RELEASE_NOTES.md'), Path('src/RELEASE_NOTES.md')):
              path.write_text(release_notes, encoding='utf-8', newline='\n')

          entry = '''
## v2.4.13 — Port selection and native diagnostics theme fixes

- Keep rendered ports clickable when a saved/custom calibration has a port `center` but no explicit `hitbox`; derive the normal visual hitbox instead of allowing the click to fall through to switch summary.
- Preserve blank interface descriptions as a selected-port state (`DESC —`) rather than confusing missing description data with selection failure.
- Give the native dashboard Advanced diagnostics block an explicit light foreground on its fixed dark background so it remains readable under dark-text Home Assistant themes.
- Add permanent regression coverage for calibration hitbox fallback and native diagnostics contrast.
- No device mapping, telemetry, faceplate geometry, Discovery, SNMP2MQTT, or UniFi2MQTT behaviour changes.

'''
          changelog = Path('CHANGELOG.md').read_text(encoding='utf-8')
          if '## v2.4.13 — Port selection and native diagnostics theme fixes' in changelog:
              raise SystemExit('v2.4.13 changelog entry already exists')
          changelog = entry + changelog
          for path in (Path('CHANGELOG.md'), Path('src/CHANGELOG.md')):
              path.write_text(changelog, encoding='utf-8', newline='\n')

          test_text = r'''from pathlib import Path

ROOT = Path(__file__).resolve().parents[1]
CARD_SOURCE = ROOT / "src" / "js" / "switch-vision.js"
CARD_PACKAGED = ROOT / "src" / "custom_components" / "switch_vision" / "switch-vision-card.js"
PANEL = ROOT / "src" / "custom_components" / "switch_vision" / "switch-vision-panel.js"

OLD_META = ".meta{font-family:monospace;white-space:pre-wrap;word-break:break-word;background:#0d1216;padding:12px;border-radius:8px;max-height:320px;overflow:auto}"
NEW_META = ".meta{font-family:monospace;white-space:pre-wrap;word-break:break-word;background:#0d1216;color:#e8eef3;padding:12px;border-radius:8px;max-height:320px;overflow:auto}"


def assert_hitbox_fallback(path: Path) -> None:
    text = path.read_text(encoding="utf-8")
    assert "if (!item?.center) return;" in text, path
    assert 'const fallbackHitbox = type === "port" ? [34, 56] : [94, 48];' in text, path
    assert "visualHitboxSize(type, item.hitbox || fallbackHitbox)" in text, path
    assert "if (!item?.center || !item?.hitbox) return;" not in text, path


def main() -> None:
    assert_hitbox_fallback(CARD_SOURCE)
    assert_hitbox_fallback(CARD_PACKAGED)

    panel = PANEL.read_text(encoding="utf-8")
    assert NEW_META in panel
    assert OLD_META not in panel

    print("Port selection/theme regressions: PASS")


if __name__ == "__main__":
    main()
'''
          Path('tests/test_port_selection_theme_regressions.py').write_text(test_text, encoding='utf-8', newline='\n')
          PY

      - name: Build Core 2.4.13
        shell: bash
        run: |
          set -euo pipefail
          python3 build.py -v 2.4.13
          rm -f \
            Releases/switch-vision-2.4.13.zip \
            Releases/switch-vision-2.4.13.zip.sha256 \
            Switch_Vision_v2.4.13_source.zip \
            Switch_Vision_v2.4.13_SHA256SUMS.txt

      - name: Run full Core validation
        shell: bash
        run: |
          set -euo pipefail
          node --check src/js/switch-vision.js
          node --check src/custom_components/switch_vision/switch-vision-card.js
          node --check src/custom_components/switch_vision/switch-vision-panel.js
          node --check src/custom_components/switch_vision/switch-vision-dashboard-strategy.js
          python3 tools/check_core_release_parity.py
          python3 -m py_compile \
            src/custom_components/switch_vision/__init__.py \
            src/custom_components/switch_vision/config_flow.py \
            src/devices/generate_supported_devices.py \
            tests/*.py
          for test in tests/test_*.py; do
            echo "::group::$test"
            python3 "$test"
            echo "::endgroup::"
          done
          find src tests -type d -name '__pycache__' -prune -exec rm -rf {} +
          find src tests -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          git diff --check
          test "$(cat VERSION)" = "2.4.13"
          test -d Releases/switch-vision-2.4.13

      - name: Verify deterministic rebuild and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/prepare-core-2.4.13-ui-temp.yml
          git add -A

          python3 build.py -v 2.4.13
          rm -f \
            Releases/switch-vision-2.4.13.zip \
            Releases/switch-vision-2.4.13.zip.sha256 \
            Switch_Vision_v2.4.13_source.zip \
            Switch_Vision_v2.4.13_SHA256SUMS.txt
          find src tests -type d -name '__pycache__' -prune -exec rm -rf {} +
          find src tests -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          git diff --exit-code

          if [ -n "$(git status --porcelain --untracked-files=all | grep '^??' || true)" ]; then
            echo 'ERROR: deterministic rebuild left unexpected untracked files'
            git status --short --untracked-files=all
            exit 1
          fi

          git config user.name 'switch-vision-release-bot'
          git config user.email 'switch-vision@users.noreply.github.com'
          git commit -m 'Core 2.4.13: fix port selection and diagnostics theme'
          git push origin HEAD:review/inbox-audit-core-2.4.13
