name: Prepare public attribution privacy policy

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check PyYAML
      - name: Sanitize public history and metadata
        run: python3 tools/sanitize_public_attribution.py --core-version 2.4.11
      - name: Build and validate Core 2.4.11
        shell: bash
        run: |
          set -euo pipefail
          python3 build.py -v 2.4.11
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 tools/check_core_release_parity.py
          node --check src/js/switch-vision.js
          node --check src/custom_components/switch_vision/switch-vision-card.js
          git diff --check
      - name: Commit tested source
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/prepare-public-attribution-policy.yml
          git config user.name 'switch-vision-release-bot'
          git config user.email 'switch-vision@users.noreply.github.com'
          git add -A
          git commit -m 'Core v2.4.11: enforce public attribution privacy policy'
          git push origin HEAD:main
